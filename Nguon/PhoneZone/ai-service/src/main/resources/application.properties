quarkus.application.name=ai-service
quarkus.http.port=8085
# The web storefront runs on port 8080 and calls this service directly from the browser.
quarkus.http.cors=true
quarkus.http.cors.origins=http://localhost:8080,http://127.0.0.1:8080
quarkus.http.cors.methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with,origin
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${POSTGRES_USER:shop}
quarkus.datasource.password=${POSTGRES_PASSWORD:shop}
quarkus.datasource.jdbc.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/shop_ai
quarkus.hibernate-orm.database.generation=update
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/swagger
quarkus.smallrye-health.root-path=/health
quarkus.http.limits.max-body-size=20M

# Optional provider endpoint. When unset, the agent still returns deterministic product-assistant guidance.
shop.ai.provider-url=${AI_PROVIDER_URL:}
shop.ai.api-key=${AI_API_KEY:}
# Gemini OpenAI-compatible endpoint is supplied through AI_PROVIDER_URL.
shop.ai.model=${AI_MODEL:gemini-3.7-flash}
shop.agent-service.url=${AGENT_SERVICE_URL:http://localhost:8086}
mp.jwt.verify.issuer=https://shop.example.com
mp.jwt.verify.publickey.location=publicKey.pem
