# =========================================================
# PAYMENT SERVICE - cau hinh + MoMo sandbox
# =========================================================
quarkus.application.name=payment-service
quarkus.http.port=8084

# Frontend base URL for redirects and browser links (used when gateway is not in front)
frontend.base-url=${FRONTEND_BASE_URL:http://localhost:8080}

# CORS cho test.html va frontend khac
quarkus.http.cors=true
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:8080,http://127.0.0.1:8080}
quarkus.http.cors.methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with,origin
quarkus.http.cors.exposed-headers=Content-Disposition
quarkus.http.cors.access-control-max-age=24H
quarkus.http.cors.access-control-allow-credentials=false

# ---- PostgreSQL DataSource (luu lich su giao dich) ----
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER:shop}
quarkus.datasource.password=${DB_PASSWORD:shop}
quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:shop_payment}

quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.log.sql=false

# =========================================================
# MoMo Sandbox - test credentials cong khai cua MoMo
# Xem: https://developers.momo.vn/v3/vi/docs/payment/onboarding/test-instructions/
# =========================================================
momo.endpoint=https://test-payment.momo.vn
# Khong ghi khoa that trong source code. Dat cac bien MOMO_* trong file .env local.
# Gia tri mac dinh giu lai sandbox demo de giao dien co the tao QR khi chua cau hinh.
momo.partner-code=${MOMO_PARTNER_CODE:MOMO}
momo.access-key=${MOMO_ACCESS_KEY:F8BBA842ECF85}
momo.secret-key=${MOMO_SECRET_KEY:K951B6PE1waDMi640xX08PD3vg6EkVlz}

# URL ma MoMo se goi nguoc lai (IPN - Instant Payment Notification)
# Khi deploy len internet, thay localhost bang domain that
# Khi test local: dung ngrok de expose ra ngoai
momo.ipn-url=${MOMO_IPN_URL:http://localhost:8084/api/payments/momo/ipn}

# URL chuyen huong nguoi dung sau khi thanh toan xong
# Frontend cua he thong dang chay qua API Gateway cong 8080.
momo.redirect-url=${MOMO_REDIRECT_URL:http://localhost:8080/cart.html}

# ---- VNPay Sandbox ----
vnpay.tmn-code=${VNPAY_TMN_CODE:}
vnpay.hash-secret=${VNPAY_HASH_SECRET:}
vnpay.payment-url=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
vnpay.return-url=${VNPAY_RETURN_URL:http://localhost:8084/api/payments/vnpay/return}

# ---- ZaloPay Sandbox ----
# "disabled" keeps the service bootable until Sandbox credentials are supplied in .env.
zalopay.app-id=${ZALOPAY_APP_ID:disabled}
zalopay.key1=${ZALOPAY_KEY1:disabled}
zalopay.key2=${ZALOPAY_KEY2:disabled}
zalopay.callback-url=${ZALOPAY_CALLBACK_URL:http://localhost:8084/api/payments/zalopay/callback}
zalopay.redirect-url=${ZALOPAY_REDIRECT_URL:http://localhost:8080/history.html?payment=zalopay}

# ---- REST clients ----
quarkus.rest-client.momo-client.url=${momo.endpoint}
quarkus.rest-client.zalopay-client.url=https://sb-openapi.zalopay.vn
quarkus.rest-client.order-client.url=${ORDER_SERVICE_URL:http://localhost:8083}

# ---- JWT ----
mp.jwt.verify.issuer=https://shop.example.com
mp.jwt.verify.publickey.location=publicKey.pem

# ---- OpenAPI ----
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/swagger
mp.openapi.extensions.smallrye.info.title=Payment Service API
mp.openapi.extensions.smallrye.info.version=1.0.0

# ---- Health ----
quarkus.smallrye-health.root-path=/health

# ---- Kubernetes ----
quarkus.kubernetes.namespace=shop
quarkus.kubernetes.replicas=2
quarkus.kubernetes.service-type=cluster-ip
quarkus.container-image.group=shop
quarkus.container-image.name=payment-service
quarkus.container-image.tag=1.0.0
