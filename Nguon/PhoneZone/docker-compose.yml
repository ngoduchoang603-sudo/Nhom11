# docker-compose.yml — chay local de test truoc khi deploy len K8s
# Cach chay:  docker-compose up --build
services:
  # ========== DATABASES ==========
  # PostgreSQL server dung chung, moi microservice so huu mot database rieng.
  postgres-ai:
    image: postgres:16-alpine
    container_name: postgres-ai
    environment:
      POSTGRES_DB: shop_ai
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
    ports:
      - "5432:5432"
    volumes:
      - postgres-ai-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop -d shop_ai"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-init:
    image: postgres:16-alpine
    container_name: postgres-init
    environment:
      PGPASSWORD: shop
    depends_on:
      postgres-ai:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        for database in shop_user shop_product shop_order shop_payment; do
          psql -h postgres-ai -U shop -d postgres -tc "SELECT 1 FROM pg_database WHERE datname = '$$database'" | grep -q 1 || psql -h postgres-ai -U shop -d postgres -c "CREATE DATABASE $$database";
        done
        # Upgrade needed for anonymous, consented behaviour events. It is safe
        # on a fresh installation where the Hibernate table does not exist yet.
        psql -h postgres-ai -U shop -d shop_ai -c "ALTER TABLE behavior_events ALTER COLUMN userid DROP NOT NULL" 2>/dev/null || true

  kafka:
    image: apache/kafka:3.9.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  # Creates the demo topic deterministically so it is visible before the first order.
  kafka-init:
    image: apache/kafka:3.9.0
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: >
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092
      --create --if-not-exists --topic shop.order.created.v1
      --partitions 3 --replication-factor 1
    restart: "no"

  # Browser UI for demonstrating topics, consumer groups and event payloads.
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: kafka-ui
    environment:
      KAFKA_CLUSTERS_0_NAME: shop-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports:
      - "8087:8080"
    depends_on:
      kafka:
        condition: service_healthy

  # Cache/session layer. It is internal-only; no host port is exposed.
  redis:
    image: redis:7.4-alpine
    container_name: redis
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ========== MICROSERVICES ==========
  user-service:
    build: ./user-service
    container_name: user-service
    environment:
      DB_HOST: postgres-ai
      DB_PORT: "5432"
      DB_NAME: shop_user
      DB_USER: shop
      DB_PASSWORD: shop
    ports:
      - "8081:8081"
    depends_on:
      postgres-init:
        condition: service_completed_successfully

  product-service:
    build: ./product-service
    container_name: product-service
    environment:
      ORDER_SERVICE_URL: "http://order-service:8083"
      DB_HOST: postgres-ai
      DB_PORT: "5432"
      DB_NAME: shop_product
      DB_USER: shop
      DB_PASSWORD: shop
    ports:
      - "8082:8082"
    depends_on:
      postgres-init:
        condition: service_completed_successfully

  order-service:
    build: ./order-service
    container_name: order-service
    environment:
      DB_HOST: postgres-ai
      DB_PORT: "5432"
      DB_NAME: shop_order
      DB_USER: shop
      DB_PASSWORD: shop
      USER_SERVICE_URL: "http://user-service:8081"
      PRODUCT_SERVICE_URL: "http://product-service:8082"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
      ORDER_EVENTS_ENABLED: "true"
      AGENT_INTERNAL_KEY: "${AGENT_INTERNAL_KEY:-local-demo-agent-key-change-me}"
    ports:
      - "8083:8083"
    depends_on:
      postgres-init:
        condition: service_completed_successfully
      user-service:
        condition: service_started
      product-service:
        condition: service_started
      kafka:
        condition: service_healthy

  ai-service:
    build: ./ai-service
    container_name: ai-service
    environment:
      # Docker Desktop commonly has no IPv6 egress; avoid Java trying that route first.
      JAVA_TOOL_OPTIONS: "-Djava.net.preferIPv4Stack=true"
      POSTGRES_HOST: postgres-ai
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
      AGENT_SERVICE_URL: "http://agent-service:8086"
      # Quarkus map SHOP_AI_* -> shop.ai.*; gia tri lay tu .env cua nguoi dung.
      SHOP_AI_PROVIDER_URL: "${AI_PROVIDER_URL:-}"
      SHOP_AI_API_KEY: "${AI_API_KEY:-}"
      SHOP_AI_MODEL: "${AI_MODEL:-gemini-3.7-flash}"
    ports:
      - "8085:8085"
    depends_on:
      postgres-ai:
        condition: service_healthy
      agent-service:
        condition: service_started

  # Agent orchestration is isolated from the LLM/chat service. It owns only
  # read-only business tools and never receives database credentials.
  agent-service:
    build: ./agent-service
    container_name: agent-service
    environment:
      PRODUCT_SERVICE_URL: "http://product-service:8082"
      ORDER_SERVICE_URL: "http://order-service:8083"
      AGENT_INTERNAL_KEY: "${AGENT_INTERNAL_KEY:-local-demo-agent-key-change-me}"
      AI_SERVICE_URL: "http://ai-service:8085"
    ports:
      - "8086:8086"
    depends_on:
      product-service:
        condition: service_started

  payment-service:
    build: ./payment-service
    container_name: payment-service
    environment:
      DB_HOST: postgres-ai
      DB_PORT: "5432"
      DB_NAME: shop_payment
      DB_USER: shop
      DB_PASSWORD: shop
      ORDER_SERVICE_URL: "http://order-service:8083"
      # Voi local test: dung ngrok de expose ra Internet
      # vi du:  ngrok http 8084  → set MOMO_IPN_URL=https://xxx.ngrok.io/api/payments/momo/ipn
      MOMO_IPN_URL: "${MOMO_IPN_URL:-http://localhost:8084/api/payments/momo/ipn}"
      MOMO_REDIRECT_URL: "${MOMO_REDIRECT_URL:-http://localhost:8080/cart.html}"
      MOMO_PARTNER_CODE: "${MOMO_PARTNER_CODE:-MOMO}"
      MOMO_ACCESS_KEY: "${MOMO_ACCESS_KEY:-F8BBA842ECF85}"
      MOMO_SECRET_KEY: "${MOMO_SECRET_KEY:-K951B6PE1waDMi640xX08PD3vg6EkVlz}"
      VNPAY_TMN_CODE: "${VNPAY_TMN_CODE:-}"
      VNPAY_HASH_SECRET: "${VNPAY_HASH_SECRET:-}"
      VNPAY_RETURN_URL: "${VNPAY_RETURN_URL:-http://localhost:8084/api/payments/vnpay/return}"
      # Keep Payment Service running before ZaloPay Sandbox credentials are configured.
      ZALOPAY_APP_ID: "${ZALOPAY_APP_ID:-disabled}"
      ZALOPAY_KEY1: "${ZALOPAY_KEY1:-disabled}"
      ZALOPAY_KEY2: "${ZALOPAY_KEY2:-disabled}"
      ZALOPAY_CALLBACK_URL: "${ZALOPAY_CALLBACK_URL:-http://localhost:8084/api/payments/zalopay/callback}"
      ZALOPAY_REDIRECT_URL: "${ZALOPAY_REDIRECT_URL:-http://localhost:8080/history.html?payment=zalopay}"
    ports:
      - "8084:8084"
    depends_on:
      postgres-init:
        condition: service_completed_successfully
      order-service:
        condition: service_started

  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    environment:
      USER_SERVICE_URL: "http://user-service:8081"
      PRODUCT_SERVICE_URL: "http://product-service:8082"
      ORDER_SERVICE_URL: "http://order-service:8083"
      PAYMENT_SERVICE_URL: "http://payment-service:8084"
    ports:
      - "8080:8080"
    depends_on:
      - user-service
      - product-service
      - order-service
      - payment-service

  kong:
    image: kong:3.8
    container_name: kong
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /usr/local/kong/declarative/kong.yml
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
    ports:
      - "8000:8000"
      - "127.0.0.1:8001:8001"
    volumes:
      - ./kong/kong.yml:/usr/local/kong/declarative/kong.yml:ro
    depends_on:
      - api-gateway
      - ai-service

volumes:
  postgres-ai-data:
  redis-data:
