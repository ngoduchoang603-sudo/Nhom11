quarkus.application.name=agent-service
quarkus.http.port=8086
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/swagger
quarkus.smallrye-health.root-path=/health
shop.product-service.url=${PRODUCT_SERVICE_URL:http://localhost:8082}
shop.order-service.url=${ORDER_SERVICE_URL:http://localhost:8083}
# Must be supplied by Docker/.env outside local development. It protects the
# read-only internal context endpoint in Order service.
shop.agent.internal.key=${AGENT_INTERNAL_KEY:local-demo-agent-key-change-me}
shop.ai-service.url=${AI_SERVICE_URL:http://localhost:8085}
