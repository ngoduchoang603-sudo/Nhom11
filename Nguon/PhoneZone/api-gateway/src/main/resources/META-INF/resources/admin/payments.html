<!DOCTYPE html>
<html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Thanh toán – PhoneZone Admin</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet"></head>
<body><nav class="sidebar" id="sidebar"></nav><main class="main"><div class="page-header"><h1><i class="fas fa-credit-card"></i> Quản lý thanh toán</h1><button class="btn-outline" onclick="loadPayments()"><i class="fas fa-sync"></i> Refresh</button></div>
<div class="row-g grid-stats" style="margin-bottom:20px"><div class="stat-card"><div class="stat-num" id="pending">-</div><div class="stat-lbl">Chưa thanh toán</div></div><div class="stat-card"><div class="stat-num" id="success">-</div><div class="stat-lbl">Đã thanh toán</div></div><div class="stat-card"><div class="stat-num" id="refunded">-</div><div class="stat-lbl">Đã hoàn tiền</div></div><div class="stat-card"><div class="stat-num price" id="paidTotal">-</div><div class="stat-lbl">Tổng đã thu</div></div></div>
<div class="card-box"><div style="display:flex;gap:10px;margin-bottom:14px"><input id="search" class="form-control" placeholder="Tìm mã đơn PZ-..., mã giao dịch..." oninput="render()"><select id="statusFilter" class="form-select" style="width:190px" onchange="render()"><option value="">Tất cả trạng thái</option><option>PENDING</option><option>SUCCESS</option><option>FAILED</option><option>EXPIRED</option><option>REFUNDED</option></select></div><div style="overflow:auto"><table><thead><tr><th>Mã giao dịch</th><th>Mã đơn</th><th>Phương thức</th><th>Số tiền</th><th>Trạng thái</th><th>Thời gian</th><th>Thao tác</th></tr></thead><tbody id="rows"><tr><td colspan="7" class="loading">Đang tải...</td></tr></tbody></table></div></div>
<p style="font-size:12px;color:#888;margin-top:12px"><i class="fas fa-circle-info"></i> Hoàn tiền hiện ghi nhận cho MoMo Sandbox. Khi dùng thật cần kết nối Refund API của MoMo/VNPay và xác nhận từ cổng thanh toán.</p></main>
<script src="../js/api.js"></script><script src="admin-shared.js"></script><script>
let payments=[];
const label={PENDING:'Chưa thanh toán',SUCCESS:'Đã thanh toán',FAILED:'Thất bại',EXPIRED:'Hết hạn',REFUNDED:'Đã hoàn tiền'};
function badge(s){const color={PENDING:'#f39c12',SUCCESS:'#27ae60',FAILED:'#e74c3c',EXPIRED:'#888',REFUNDED:'#3498db'}[s]||'#888';return `<span style="background:${color}18;color:${color};padding:5px 9px;border-radius:99px;font-size:11px;font-weight:700">${label[s]||s}</span>`}
function orderCode(p){return formatOrderCode({id:p.orderId,date:p.createdAt})}
function methodLabel(method){return method==='MOMO'?'💳 MoMo':method==='VNPAY'?'🏦 VNPay':method==='COD'?'💵 COD':esc(method)}
function render(){const q=document.getElementById('search').value.toLowerCase().trim();const f=document.getElementById('statusFilter').value;const list=payments.filter(p=>(!f||p.status===f)&&(!q||[p.id,p.orderId,orderCode(p),p.transactionId,p.momoOrderId].join(' ').toLowerCase().includes(q)));document.getElementById('rows').innerHTML=list.length?list.map(p=>`<tr><td><b>#${p.id}</b><div style="font-size:11px;color:#888">${esc(p.transactionId||p.momoOrderId||'-')}</div></td><td><b>${orderCode(p)}</b></td><td>${methodLabel(p.method)}</td><td class="price">${formatPrice(p.amount)}</td><td>${badge(p.status)}</td><td style="font-size:12px">${p.createdAt?new Date(p.createdAt).toLocaleString('vi-VN'):'-'}</td><td style="white-space:nowrap"><button class="btn-info" onclick="view(${p.id})" title="Xem chi tiết"><i class="fas fa-eye"></i></button>${p.status==='PENDING'&&p.method==='MOMO'?`<button class="btn-info" onclick="sync(${p.id})" title="Đồng bộ MoMo"><i class="fas fa-rotate"></i></button><button class="btn-warn" onclick="manualConfirm(${p.id})" title="Xác nhận thủ công"><i class="fas fa-check"></i></button>`:''}${p.status==='PENDING'&&p.method==='COD'?`<button class="btn-warn" onclick="collect(${p.id})" title="Xác nhận đã thu COD"><i class="fas fa-money-bill"></i></button>`:''}${p.status==='SUCCESS'?`<button class="btn-danger" onclick="refund(${p.id})" title="Hoàn tiền Sandbox"><i class="fas fa-rotate-left"></i></button>`:''}</td></tr>`).join(''):'<tr><td colspan="7" class="empty-state">Không có giao dịch phù hợp</td></tr>'}
function view(id){const p=payments.find(x=>x.id===id);if(!p)return;alert(`Giao dịch #${p.id}\nĐơn: ${formatOrderCode({id:p.orderId,date:p.createdAt})}\nPhương thức: ${p.method}\nSố tiền: ${formatPrice(p.amount)}\nTrạng thái: ${label[p.status]||p.status}\nMã cổng thanh toán: ${p.transactionId||p.momoOrderId||'-'}\nThông báo: ${p.message||'-'}`)}
async function loadPayments(){try{payments=await http(`${API.payment}/api/payments`);document.getElementById('pending').textContent=payments.filter(p=>p.status==='PENDING').length;document.getElementById('success').textContent=payments.filter(p=>p.status==='SUCCESS').length;document.getElementById('refunded').textContent=payments.filter(p=>p.status==='REFUNDED').length;document.getElementById('paidTotal').textContent=formatPrice(payments.filter(p=>p.status==='SUCCESS').reduce((s,p)=>s+(p.amount||0),0));render()}catch(e){showToast('Không tải được giao dịch: '+e.message,'error')}}
async function sync(id){try{await http(`${API.payment}/api/payments/${id}/query`,{method:'POST'});showToast('Đã đồng bộ trạng thái MoMo','success');loadPayments()}catch(e){showToast('Lỗi đồng bộ: '+e.message,'error')}}
async function manualConfirm(id){const note=prompt('Lý do xác nhận thủ công (bắt buộc):');if(!note||!note.trim()){showToast('Cần nhập lý do xác nhận thủ công','warning');return}if(!confirm('Chỉ xác nhận khi đã đối chiếu giao dịch MoMo thật. Tiếp tục?'))return;try{await http(`${API.payment}/api/payments/${id}/manual-confirm?success=true&note=${encodeURIComponent(note.trim())}`,{method:'POST'});showToast('Đã xác nhận thanh toán thủ công','success');loadPayments()}catch(e){showToast('Không thể xác nhận: '+e.message,'error')}}
async function collect(id){if(!confirm('Xác nhận shipper đã thu tiền COD?'))return;try{await http(`${API.payment}/api/payments/${id}/cod/collected`,{method:'POST'});showToast('Đã xác nhận thu COD','success');loadPayments()}catch(e){showToast('Lỗi: '+e.message,'error')}}
async function refund(id){const note=prompt('Lý do hoàn tiền (Sandbox):');if(note===null)return;try{await http(`${API.payment}/api/payments/${id}/refund?note=${encodeURIComponent(note)}`,{method:'POST'});showToast('Đã ghi nhận hoàn tiền Sandbox','success');loadPayments()}catch(e){showToast('Không thể hoàn tiền: '+e.message,'error')}}
document.addEventListener('DOMContentLoaded',()=>{if(initAdminLayout('payment'))loadPayments()});
</script></body></html>
