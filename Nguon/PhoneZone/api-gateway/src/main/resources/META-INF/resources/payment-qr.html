<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Thanh toán ZaloPay | PhoneZone</title><style>body{margin:0;font-family:Arial,sans-serif;background:#f4f6fb;color:#182033;display:grid;place-items:center;min-height:100vh}.card{width:min(420px,calc(100% - 32px));background:#fff;border-radius:18px;box-shadow:0 16px 45px #18203322;overflow:hidden;text-align:center}.head{background:linear-gradient(135deg,#0068ff,#35a4ff);color:#fff;padding:20px}.head h1{font-size:20px;margin:0}.body{padding:25px}.amount{font-size:27px;font-weight:800;color:#d70018;margin:0 0 8px}.hint{color:#64748b;font-size:14px}.qr{width:238px;height:238px;margin:20px auto;border:1px solid #e2e8f0;border-radius:12px;padding:9px}.status{padding:11px;border-radius:9px;background:#fff7df;color:#8a6510;font-weight:700}.back{display:inline-block;margin-top:20px;color:#fff;background:#d70018;border-radius:8px;padding:11px 16px;text-decoration:none;font-weight:700}</style></head>
<body><main class="card"><header class="head"><h1>▦ Thanh toán ZaloPay</h1></header><section class="body"><p class="amount" id="amount">Đang tải...</p><p class="hint" id="info">Vui lòng quét mã bằng ứng dụng ZaloPay</p><img class="qr" id="qr" alt="Mã QR thanh toán" hidden><p class="status" id="status">Đang tạo mã thanh toán…</p><a class="back" id="back" href="ai-chat.html">Quay lại Trợ lý AI</a></section></main>
<script src="js/api.js"></script><script>
const id=new URLSearchParams(location.search).get('paymentId');
const money=n=>new Intl.NumberFormat('vi-VN').format(n||0)+'đ';
async function refresh(){try{if(!id)throw new Error('Không tìm thấy giao dịch');const p=await http(API.payment+'/api/payments/'+encodeURIComponent(id)+'/query',{method:'POST'});document.getElementById('amount').textContent=money(p.amount);document.getElementById('info').textContent='Giao dịch #'+id+' · '+(p.method||'ZaloPay');if(p.qrCodeUrl){const qr=document.getElementById('qr');qr.src='https://api.qrserver.com/v1/create-qr-code/?size=220x220&data='+encodeURIComponent(p.qrCodeUrl);qr.hidden=false}const status=document.getElementById('status');if(p.status==='SUCCESS'){status.textContent='✓ Thanh toán thành công';status.style.background='#e8f7ec';status.style.color='#157a36';document.getElementById('back').href='ai-chat.html?payment=success&paymentId='+encodeURIComponent(id);return}if(p.status==='FAILED'||p.status==='EXPIRED'){status.textContent='Thanh toán chưa thành công: '+(p.message||'Vui lòng tạo lại giao dịch');status.style.background='#ffebee';status.style.color='#b42318';return}status.textContent='Đang chờ thanh toán…';setTimeout(refresh,3000)}catch(e){const status=document.getElementById('status');status.textContent=e.message||'Không thể tải giao dịch';status.style.background='#ffebee';status.style.color='#b42318'}}
refresh();
setInterval(()=>{const status=document.getElementById('status');if(status&&status.textContent.includes('chưa thành công'))document.getElementById('back').href='ai-chat.html?payment=failed';},500);
</script></body></html>
