<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nhật ký AI – PhoneZone Admin</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link rel="stylesheet" href="admin.css"></head><body><nav class="sidebar" id="sidebar"></nav><main class="main"><div class="page-header"><h1><i class="fas fa-robot"></i> Nhật ký AI</h1><button class="btn-red" onclick="load()"><i class="fas fa-rotate"></i> Làm mới</button></div><div class="notice"><i class="fas fa-shield-halved"></i> Chỉ ghi nhận loại điều phối, công cụ đã gọi và thời gian phản hồi. Nội dung chat, token và thông tin khách không hiển thị tại đây.</div><div class="row-g grid-stats"><div class="stat-card"><div class="stat-num" id="runs">0</div><div class="stat-lbl">Lượt xử lý</div></div><div class="stat-card"><div class="stat-num" id="toolRuns">0</div><div class="stat-lbl">Có gọi công cụ</div></div><div class="stat-card"><div class="stat-num" id="latency">0 ms</div><div class="stat-lbl">Độ trễ trung bình</div></div></div><div class="card-box"><table><thead><tr><th>Thời gian</th><th>Loại xử lý</th><th>Công cụ</th><th>Độ trễ</th><th>Thông số</th></tr></thead><tbody id="rows"><tr><td colspan="5" class="loading">Đang tải...</td></tr></tbody></table></div></main><script src="../js/api.js"></script><script src="admin-shared.js"></script><script>let data=[];function fmt(ms){return `${Number(ms||0).toLocaleString('vi-VN')} ms`}function render(){runs.textContent=data.length;toolRuns.textContent=data.filter(x=>(x.tools||[]).length).length;latency.textContent=fmt(data.length?Math.round(data.reduce((s,x)=>s+(x.latencyMs||0),0)/data.length):0);rows.innerHTML=data.length?data.map(x=>`<tr><td>${x.createdAt?new Date(x.createdAt).toLocaleString('vi-VN'):'-'}</td><td><b>${esc(x.route||'agent-tool-route')}</b></td><td>${(x.tools||[]).length?(x.tools||[]).map(t=>`<span class="badge badge-stock">${esc(t)}</span>`).join(' '):'<span class="muted">LLM / fallback</span>'}</td><td>${fmt(x.latencyMs)}</td><td class="muted">Prompt: ${esc(x.usage?.promptChars??'-')} ký tự · Trả lời: ${esc(x.usage?.answerChars??'-')} ký tự</td></tr>`).join(''):'<tr><td colspan="5" class="empty-state">Chưa có lượt AI nào</td></tr>'}async function load(){try{data=await http(`${API.ai}/admin/agent-runs?limit=100`);render()}catch(e){rows.innerHTML=`<tr><td colspan="5" class="empty-state">Không tải được nhật ký AI: ${esc(e.message)}</td></tr>`}}document.addEventListener('DOMContentLoaded',()=>{if(initAdminLayout('agent-log'))load()});</script><style>.notice{background:#f3f8ff;border:1px solid #d5e7ff;color:#386794;padding:12px 14px;border-radius:9px;margin-bottom:17px;font-size:13px}.notice i{margin-right:7px}.muted{color:#8b8b95;font-size:12px}.badge{display:inline-block;margin:2px 3px 2px 0}.grid-stats{grid-template-columns:repeat(3,1fr);margin-bottom:18px}@media(max-width:700px){.grid-stats{grid-template-columns:1fr}}</style></body></html>
