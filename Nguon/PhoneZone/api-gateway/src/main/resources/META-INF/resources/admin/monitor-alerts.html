<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cảnh báo vận hành – PhoneZone</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link rel="stylesheet" href="admin.css"></head><body><nav class="sidebar" id="sidebar"></nav><main class="main"><div class="page-header"><h1><i class="fas fa-bell"></i> Cảnh báo vận hành</h1><div><button class="btn-outline" onclick="scan()"><i class="fas fa-magnifying-glass"></i> Quét ngay</button><button class="btn-red" onclick="load()"><i class="fas fa-rotate"></i> Làm mới</button></div></div><div class="notice"><i class="fas fa-robot"></i> Monitor Agent chỉ phát hiện và cảnh báo. Mọi xác nhận đơn, hoàn tiền hoặc xử lý hậu mãi vẫn do nhân viên thực hiện.</div><div class="card-box"><table><thead><tr><th>Mức độ</th><th>Loại</th><th>Nội dung</th><th>Cập nhật</th></tr></thead><tbody id="rows"><tr><td colspan="4" class="loading">Đang tải...</td></tr></tbody></table></div></main><script src="../js/api.js"></script><script src="admin-shared.js"></script><script>const label={ORDER_PENDING:'Đơn chờ xử lý',AFTER_SALES:'Hậu mãi',COUPON_EXPIRING:'Mã sắp hết hạn'};function badge(a){const c=a.severity==='HIGH'?'badge-disc':a.severity==='MEDIUM'?'badge-pending':'badge-stock';return `<span class="badge ${c}">${a.severity==='HIGH'?'Cao':a.severity==='MEDIUM'?'Trung bình':'Thấp'}</span>`}async function load(){try{const data=await http(`${API.order}/api/monitor-alerts`);rows.innerHTML=data.length?data.map(a=>`<tr><td>${badge(a)}</td><td>${esc(label[a.type]||a.type)}</td><td>${esc(a.message)}</td><td>${a.updatedAt?new Date(a.updatedAt).toLocaleString('vi-VN'):'-'}</td></tr>`).join(''):'<tr><td colspan="4" class="empty-state">Không có cảnh báo cần xử lý</td></tr>'}catch(e){rows.innerHTML=`<tr><td colspan="4" class="empty-state">${esc(e.message)}</td></tr>`}}async function scan(){try{await http(`${API.order}/api/monitor-alerts/scan`,{method:'POST'});showToast('Monitor Agent đã quét dữ liệu','success');load()}catch(e){showToast('Không quét được: '+e.message,'error')}}document.addEventListener('DOMContentLoaded',()=>{if(initAdminLayout('monitor'))load()});</script><style>.notice{background:#f3f8ff;border:1px solid #d5e7ff;color:#386794;padding:12px 14px;border-radius:9px;margin-bottom:17px;font-size:13px}</style></body></html>
