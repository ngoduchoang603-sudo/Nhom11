<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quản trị – PhoneZone</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet"></head>
<body><nav class="sidebar" id="sidebar"></nav><main class="main"><div class="page-header"><h1 id="title"></h1><button class="btn-outline" onclick="load()"><i class="fas fa-sync"></i> Refresh</button></div><div id="content" class="card-box"><div class="loading">Đang tải...</div></div></main><script src="../js/api.js"></script><script src="admin-shared.js"></script><script>
const mode=new URLSearchParams(location.search).get('mode')||'inventory';if(mode==='warranties')location.replace('after-sales.html');const config={inventory:['inventory','fa-boxes-stacked','Kho & phiên bản sản phẩm'],promotions:['promotion','fa-tags','Khuyến mãi'],reports:['report','fa-chart-line','Báo cáo doanh thu'],comments:['comment','fa-comments','Duyệt bình luận']}[mode]||['inventory','fa-boxes-stacked','Kho & phiên bản sản phẩm'];
const managementEsc=s=>{const d=document.createElement('div');d.textContent=s??'';return d.innerHTML};
async function updateProduct(id,patch){try{await http(`${API.product}/api/products/${id}`,{method:'PUT',body:JSON.stringify(patch)});showToast('Đã cập nhật','success');load()}catch(e){showToast('Lỗi: '+e.message,'error')}}

/* ===== INVENTORY: variant-level stock management ===== */
let allVariants = {};
async function loadVariantsForAll(products) {
    const results = await Promise.all(products.map(async p => {
        try {
            const v = await http(`${API.product}/api/products/${p.id}/variants`);
            return [String(p.id), v || []];
        } catch (_) { return [String(p.id), []]; }
    }));
    allVariants = Object.fromEntries(results);
}

function variantStockSummary(p) {
    const variants = allVariants[String(p.id)] || [];
    if (variants.length === 0) return `<span style="color:#888;font-size:11px">Chưa khai báo phiên bản</span>`;
    const total = variants.reduce((s, v) => s + (v.stock || 0), 0);
    const colors = [...new Set(variants.map(v => (v.color || '').trim()).filter(Boolean))];
    return `<span style="font-size:11px;color:#555">${variants.length} phiên bản · tổng ${total} máy${colors.length ? ` · ${managementEsc(colors.join(', '))}` : ''}</span>`;
}

function variantBadge(v) {
    const level = (v.stock || 0) <= 0 ? 'out' : (v.stock || 0) <= 5 ? 'low' : '';
    const label = [v.color, v.ram, v.storage].filter(Boolean).join(' ') || v.sku;
    return `<span class="badge badge-stock ${level}" style="margin-right:4px">${managementEsc(label)}</span>`;
}

function expandVariants(p) {
    const variants = allVariants[String(p.id)] || [];
    if (variants.length === 0) {
        return `<tr id="var-${p.id}" style="display:none"><td colspan="6" style="padding:12px 20px;background:#fafafa;color:#888;font-size:12px">
            Chưa có phiên bản. Nhấn "Thêm phiên bản" để bắt đầu khai báo màu sắc / dung lượng / tồn kho chi tiết.
        </td></tr>`;
    }
    return `<tr id="var-${p.id}" style="display:none"><td colspan="6" style="padding:0;background:#fafafe">
        <table style="width:100%;font-size:12px"><thead><tr style="border-bottom:1px solid #eee">
            <th style="padding:8px 12px;width:180px">SKU</th>
            <th style="padding:8px 12px">Màu / RAM / Dung lượng</th>
            <th style="padding:8px 12px;width:100px;text-align:center">Tồn kho</th>
            <th style="padding:8px 12px;width:100px;text-align:center">Chênh giá</th>
            <th style="padding:8px 12px;width:160px;text-align:right">Thao tác</th>
        </tr></thead><tbody>${variants.map(v => {
            const level = (v.stock || 0) <= 0 ? 'out' : (v.stock || 0) <= 5 ? 'low' : '';
            return `<tr style="border-bottom:1px dashed #eee">
                <td style="padding:6px 12px"><code style="font-size:11px;color:#555">${managementEsc(v.sku)}</code></td>
                <td style="padding:6px 12px">${variantBadge(v)}</td>
                <td style="padding:6px 12px;text-align:center"><input id="vstock-${v.id}" type="number" min="0" value="${v.stock||0}" style="width:70px;border:1px solid #ddd;border-radius:5px;padding:4px 6px;text-align:center;font-size:12px"/></td>
                <td style="padding:6px 12px;text-align:center"><input id="vadj-${v.id}" type="number" value="${v.priceAdjustment||0}" style="width:90px;border:1px solid #ddd;border-radius:5px;padding:4px 6px;text-align:center;font-size:12px"/></td>
                <td style="padding:6px 12px;text-align:right;white-space:nowrap">
                    <button class="btn-info" onclick="saveVariant('${p.id}','${v.id}')" style="font-size:11px;padding:4px 8px" title="Lưu"><i class="fas fa-check"></i></button>
                    <button class="btn-del" onclick="deleteVariant('${p.id}','${v.id}')" style="font-size:11px;padding:4px 8px" title="Xóa"><i class="fas fa-trash"></i></button>
                </td>
            </tr>`;
        }).join('')}</tbody></table>
    </td></tr>`;
}

function toggleVariant(productId) {
    const row = document.getElementById('var-' + productId);
    if (!row) return;
    const isVisible = row.style.display !== 'none';
    row.style.display = isVisible ? 'none' : '';
    const btn = document.getElementById('tog-' + productId);
    if (btn) btn.innerHTML = isVisible ? '<i class="fas fa-chevron-down"></i>' : '<i class="fas fa-chevron-up"></i>';
}

async function saveVariant(productId, variantId) {
    const stock = Number(document.getElementById('vstock-' + variantId).value);
    const adj = Number(document.getElementById('vadj-' + variantId).value);
    try {
        await http(`${API.product}/api/products/${productId}/variants/${variantId}`, {
            method: 'PUT', body: JSON.stringify({ stock, priceAdjustment: adj })
        });
        showToast('Đã cập nhật phiên bản', 'success');
        await load();
    } catch (e) { showToast('Lỗi: ' + e.message, 'error'); }
}

async function deleteVariant(productId, variantId) {
    if (!confirm('Xóa phiên bản này?')) return;
    try {
        await http(`${API.product}/api/products/${productId}/variants/${variantId}`, { method: 'DELETE' });
        showToast('Đã xóa phiên bản', 'success');
        await load();
    } catch (e) { showToast('Lỗi: ' + e.message, 'error'); }
}

function showAddVariant(productId) {
    const p = allProducts.find(x => String(x.id) === String(productId));
    const productName = p ? managementEsc(p.name) : productId;
    showModal(`
        <div class="modal-header-x"><h3><i class="fas fa-plus"></i> Thêm phiên bản — ${productName}</h3><button class="modal-close-x" onclick="closeModal()">✕</button></div>
        <div class="modal-body-x">
            <div class="form-grid">
                <div><label class="form-label">SKU *</label><input id="av-sku" class="form-control" placeholder="VD: PRO-BLK-256" maxlength="100" required/></div>
                <div><label class="form-label">Tồn kho *</label><input id="av-stock" class="form-control" type="number" min="0" value="0"/></div>
                <div><label class="form-label">Màu sắc</label><input id="av-color" class="form-control" placeholder="Đen, Trang, Xanh..."/></div>
                <div><label class="form-label">RAM</label><input id="av-ram" class="form-control" placeholder="8GB"/></div>
                <div><label class="form-label">Dung lượng</label><input id="av-storage" class="form-control" placeholder="256GB"/></div>
                <div><label class="form-label">Chênh giá (VND)</label><input id="av-adj" class="form-control" type="number" value="0"/></div>
            </div>
        </div>
        <div class="modal-footer-x">
            <button class="btn-outline" onclick="closeModal()">Hủy</button>
            <button class="btn-red" onclick="submitVariant('${productId}')"><i class="fas fa-save"></i> Tạo phiên bản</button>
        </div>
    `);
}

async function submitVariant(productId) {
    const sku = document.getElementById('av-sku').value.trim();
    const stock = Number(document.getElementById('av-stock').value);
    if (!sku) { showToast('Nhập SKU', 'warning'); return; }
    try {
        await http(`${API.product}/api/products/${productId}/variants`, {
            method: 'POST',
            body: JSON.stringify({
                sku, stock,
                color: document.getElementById('av-color').value.trim() || null,
                ram: document.getElementById('av-ram').value.trim() || null,
                storage: document.getElementById('av-storage').value.trim() || null,
                priceAdjustment: Number(document.getElementById('av-adj').value) || 0
            })
        });
        showToast('Đã tạo phiên bản', 'success');
        closeModal();
        await load();
    } catch (e) { showToast('Lỗi: ' + e.message, 'error'); }
}

let allProducts = [];

function stockRow(p) {
    const variants = allVariants[String(p.id)] || [];
    const hasVariants = variants.length > 0;
    const level = (p.stock||0) <= 0 ? 'out' : (p.stock||0) <= 10 ? 'low' : '';
    return `<tr>
        <td style="cursor:pointer" onclick="toggleVariant('${p.id}')">
            <div style="display:flex;align-items:center;gap:8px">
                <button id="tog-${p.id}" class="btn-outline" style="padding:2px 6px;font-size:10px;border:1px solid #ddd;background:#fff;cursor:pointer"><i class="fas fa-chevron-down"></i></button>
                <div>
                    <b>${managementEsc(p.name)}</b>
                    <div style="font-size:11px;color:#888">${managementEsc(p.category)} · Giá ${formatPrice(p.price)}</div>
                    ${variantStockSummary(p)}
                </div>
            </div>
        </td>
        <td style="text-align:center"><span class="badge badge-stock ${level}">${p.stock||0}</span></td>
        <td>${hasVariants
            ? '<span style="font-size:11px;color:#888">Tự tính theo phiên bản</span>'
            : `<input id="stock-${p.id}" class="form-control" type="number" min="0" value="${p.stock||0}" style="width:90px"/>`}</td>
        <td style="text-align:right;white-space:nowrap">
            ${hasVariants ? '' : `<button class="btn-red" onclick="updateProduct('${p.id}',{stock:Number(document.getElementById('stock-${p.id}').value)})" style="font-size:11px;padding:4px 10px">Lưu tồn kho</button>`}
            <button class="btn-outline" onclick="showAddVariant('${p.id}')" style="font-size:11px;padding:4px 10px;margin-left:4px"><i class="fas fa-plus"></i> Phiên bản</button>
        </td>
    </tr>${expandVariants(p)}`;
}

async function load(){
    document.getElementById('content').innerHTML='<div class="loading">Đang tải...</div>';
    try{
        const [products,orders]=await Promise.all([
            http(`${API.product}/api/products`),
            http(`${API.order}/api/orders`).catch(()=>[])
        ]);
        allProducts = products;

        if(mode==='inventory'){
            await loadVariantsForAll(products);
            document.getElementById('content').innerHTML=`
                <p style="color:#888;font-size:13px;margin-bottom:14px">
                    <i class="fas fa-info-circle"></i> Quản lý tồn kho theo từng phiên bản (màu sắc / dung lượng). Nhấn mũi tên để xem chi tiết phiên bản.
                </p>
                <table><thead><tr>
                    <th>Sản phẩm</th>
                    <th style="width:110px;text-align:center">Tồn tổng</th>
                    <th style="width:110px">Cập nhật</th>
                    <th style="text-align:right;width:200px">Thao tác</th>
                </tr></thead><tbody>${products.map(stockRow).join('')}</tbody></table>`;
        } else if(mode==='promotions'){
            document.getElementById('content').innerHTML=`<p style="color:#888;font-size:13px">Thiết lập mức giảm trực tiếp cho từng sản phẩm đang bán.</p><table><thead><tr><th>Sản phẩm</th><th>Giá</th><th>Giảm hiện tại</th><th>Giảm mới (VND)</th><th></th></tr></thead><tbody>${products.map(p=>`<tr><td><b>${managementEsc(p.name)}</b></td><td>${formatPrice(p.price)}</td><td class="price">${formatPrice(p.discount||0)}</td><td><input id="discount-${p.id}" class="form-control" type="number" min="0" value="${p.discount||0}" style="width:140px"></td><td><button class="btn-red" onclick="updateProduct('${p.id}',{discount:Number(document.getElementById('discount-${p.id}').value)})">Áp dụng</button></td></tr>`).join('')}</tbody></table>`;
        } else if(mode==='reports'){
            const paid=orders.filter(o=>o.status==='DELIVERED');
            const rev=paid.reduce((s,o)=>s+(o.total||0),0);
            document.getElementById('content').innerHTML=`<div class="row-g grid-stats"><div class="stat-card"><div class="stat-num price">${formatPrice(rev)}</div><div class="stat-lbl">Doanh thu đã giao</div></div><div class="stat-card"><div class="stat-num">${paid.length}</div><div class="stat-lbl">Đơn hoàn tất</div></div><div class="stat-card"><div class="stat-num">${orders.filter(o=>o.status==='CANCELLED').length}</div><div class="stat-lbl">Đơn đã hủy</div></div></div><table><thead><tr><th>Mã đơn</th><th>Khách</th><th>Tổng</th><th>Trạng thái</th><th>Ngày</th></tr></thead><tbody>${orders.slice(0,50).map(o=>`<tr><td><b>${formatOrderCode(o)}</b></td><td>${managementEsc(o.userName||'-')}</td><td class="price">${formatPrice(o.total)}</td><td><span class="badge-status badge-${o.status}">${o.status}</span></td><td style="font-size:11px">${o.date?new Date(o.date).toLocaleString('vi-VN'):'-'}</td></tr>`).join('')}</tbody></table>`;
        } else if(mode==='comments'){
            document.getElementById('content').innerHTML='<p style="color:#888;font-size:13px">Tính năng duyệt bình luận sẽ được bổ sung.</p>';
        }
    }catch(e){document.getElementById('content').innerHTML=`<div class="empty-state"><i class="fas fa-exclamation-circle"></i><br>Lỗi: ${e.message}</div>`}
}

document.addEventListener('DOMContentLoaded',()=>{if(!initAdminLayout(config[0]))return;document.getElementById('title').innerHTML=`<i class="fas ${config[1]}"></i> ${config[2]}`;load()});
</script></body></html>
