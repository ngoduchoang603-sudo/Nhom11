<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1"/>
    <title>Người dùng – PhoneZone Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
</head>
<body>
<nav class="sidebar" id="sidebar"></nav>
<main class="main">
    <div class="page-header">
        <h1><i class="fas fa-users"></i> Quản lý người dùng</h1>
        <div style="display:flex;gap:8px">
            <button class="btn-outline" onclick="loadUsers()"><i class="fas fa-sync"></i> Refresh</button>
            <button class="btn-red" onclick="showCreateUser()"><i class="fas fa-plus"></i> Thêm người dùng</button>
        </div>
    </div>

    <div class="card-box">
        <!-- Search & filter -->
        <div style="display:flex;gap:10px;margin-bottom:16px;align-items:center;flex-wrap:wrap">
            <div style="position:relative;flex:1;min-width:200px;max-width:400px">
                <input type="text" id="searchInput" class="form-control" placeholder="Tìm theo tên đăng nhập, email..." style="padding-left:36px" oninput="filterUsers()"/>
                <i class="fas fa-search" style="position:absolute;left:12px;top:50%;transform:translateY(-50%);color:#aaa"></i>
            </div>
            <select id="filterRole" class="form-select" style="width:auto" onchange="filterUsers()">
                <option value="">Tất cả vai trò</option>
                <option value="ADMIN">Admin</option>
                <option value="USER">User</option>
                <option value="STAFF">Staff</option>
            </select>
            <div style="margin-left:auto;color:#888;font-size:13px">
                Tổng: <b id="userCount">0</b> người dùng
            </div>
        </div>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Tài khoản</th>
                    <th>Họ tên</th>
                    <th>Email</th>
                    <th>SĐT</th>
                    <th>Vai trò</th>
                    <th>Trạng thái</th>
                    <th style="text-align:right">Thao tác</th>
                </tr>
            </thead>
            <tbody id="userTable">
                <tr><td colspan="8" class="loading">Đang tải...</td></tr>
            </tbody>
        </table>
    </div>
</main>

<script src="../js/api.js"></script>
<script src="admin-shared.js"></script>
<script>
let allUsers = [];

function esc(s) { const d = document.createElement('div'); d.textContent = s ?? ''; return d.innerHTML; }

async function loadUsers() {
    try {
        allUsers = await http(`${API.user}/api/users`);
        filterUsers();
    } catch (err) {
        document.getElementById('userTable').innerHTML =
            `<tr><td colspan="8" class="empty-state"><i class="fas fa-exclamation-circle"></i><br>Lỗi: ${err.message}</td></tr>`;
    }
}

function filterUsers() {
    const kw = document.getElementById('searchInput').value.toLowerCase().trim();
    const role = document.getElementById('filterRole').value;

    let list = allUsers.slice();
    if (kw) {
        list = list.filter(u =>
            (u.username || '').toLowerCase().includes(kw) ||
            (u.fullName || '').toLowerCase().includes(kw) ||
            (u.email || '').toLowerCase().includes(kw)
        );
    }
    if (role) list = list.filter(u => u.role === role);

    document.getElementById('userCount').textContent = list.length;

    const tbody = document.getElementById('userTable');
    if (list.length === 0) {
        tbody.innerHTML = '<tr><td colspan="8" class="empty-state"><i class="fas fa-inbox"></i><br>Không có người dùng</td></tr>';
        return;
    }

    tbody.innerHTML = list.map(u => `
        <tr>
            <td><b>${u.id}</b></td>
            <td>
                <div style="display:flex;align-items:center;gap:8px">
                    <div style="width:32px;height:32px;border-radius:50%;background:${u.role === 'ADMIN' ? '#1a1a2e' : '#d70018'};color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px">
                        ${(u.username || '?')[0].toUpperCase()}
                    </div>
                    <b>${esc(u.username || '-')}</b>
                </div>
            </td>
            <td>${esc(u.fullName || '-')}</td>
            <td>${esc(u.email || '-')}</td>
            <td>${esc(u.phone || '-')}</td>
            <td><span class="badge ${u.role === 'ADMIN' ? 'badge-role-admin' : 'badge-role-user'}">${u.role || 'USER'}</span></td>
            <td>
                ${u.status === '1' ?
                    '<span class="badge badge-stock">Hoạt động</span>' :
                    '<span class="badge badge-stock out">Đã khóa</span>'}
            </td>
            <td style="text-align:right">
                <button class="btn-info" onclick="viewUser(${u.id})" title="Xem"><i class="fas fa-eye"></i></button>
                <button class="btn-warn" onclick="showEditUser(${u.id})" title="Sửa"><i class="fas fa-edit"></i></button>
                <button class="btn-del" onclick="deleteUser(${u.id}, '${esc(u.username || '')}')" title="Xóa"><i class="fas fa-trash"></i></button>
            </td>
        </tr>
    `).join('');
}

function viewUser(id) {
    const u = allUsers.find(x => x.id === id);
    if (!u) return;
    showModal(`
        <div class="modal-header-x">
            <h3><i class="fas fa-user"></i> Chi tiết người dùng</h3>
            <button class="modal-close-x" onclick="closeModal()">✕</button>
        </div>
        <div class="modal-body-x">
            <div style="text-align:center;margin-bottom:20px">
                <div style="width:70px;height:70px;border-radius:50%;background:${u.role === 'ADMIN' ? '#1a1a2e' : '#d70018'};color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:28px;font-weight:800">${(u.username || '?')[0].toUpperCase()}</div>
                <h4 style="margin-top:10px;font-size:18px;font-weight:700">${u.fullName || u.username}</h4>
                <span class="badge ${u.role === 'ADMIN' ? 'badge-role-admin' : 'badge-role-user'}">${u.role}</span>
            </div>
            <table style="width:100%;font-size:13px">
                <tr><td style="padding:8px 0;color:#888;width:35%">ID:</td><td style="font-weight:600">#${u.id}</td></tr>
                <tr><td style="padding:8px 0;color:#888">Tài khoản:</td><td style="font-weight:600">${u.username || '-'}</td></tr>
                <tr><td style="padding:8px 0;color:#888">Email:</td><td style="font-weight:600">${u.email || '-'}</td></tr>
                <tr><td style="padding:8px 0;color:#888">SĐT:</td><td style="font-weight:600">${u.phone || '-'}</td></tr>
                <tr><td style="padding:8px 0;color:#888">Giới tính:</td><td style="font-weight:600">${u.gender || '-'}</td></tr>
                <tr><td style="padding:8px 0;color:#888">Trạng thái:</td><td>${u.status === '1' ? '<span class="badge badge-stock">Hoạt động</span>' : '<span class="badge badge-stock out">Khóa</span>'}</td></tr>
            </table>
        </div>
        <div class="modal-footer-x">
            <button class="btn-outline" onclick="closeModal()">Đóng</button>
        </div>
    `);
}

function showCreateUser() {
    showModal(`
        <div class="modal-header-x">
            <h3><i class="fas fa-user-plus"></i> Thêm người dùng mới</h3>
            <button class="modal-close-x" onclick="closeModal()">✕</button>
        </div>
        <div class="modal-body-x">
            <form id="userForm" onsubmit="return submitUser(event, null)">
                <div class="form-grid">
                    <div>
                        <label class="form-label">Tài khoản *</label>
                        <input class="form-control" name="username" required minlength="3"/>
                    </div>
                    <div>
                        <label class="form-label">Mật khẩu *</label>
                        <input class="form-control" name="password" type="password" required minlength="6"/>
                    </div>
                    <div class="full">
                        <label class="form-label">Họ và tên *</label>
                        <input class="form-control" name="fullName" required/>
                    </div>
                    <div>
                        <label class="form-label">Email *</label>
                        <input class="form-control" name="email" type="email" required/>
                    </div>
                    <div>
                        <label class="form-label">Số điện thoại</label>
                        <input class="form-control" name="phone" type="tel"/>
                    </div>
                    <div>
                        <label class="form-label">Vai trò *</label>
                        <select class="form-select" name="role" required>
                            <option value="USER">USER</option>
                            <option value="ADMIN">ADMIN</option>
                            <option value="STAFF">STAFF</option>
                        </select>
                    </div>
                    <div>
                        <label class="form-label">Giới tính</label>
                        <select class="form-select" name="gender">
                            <option value="">Không xác định</option>
                            <option value="NAM">Nam</option>
                            <option value="NU">Nữ</option>
                            <option value="KHAC">Khác</option>
                        </select>
                    </div>
                </div>
            </form>
        </div>
        <div class="modal-footer-x">
            <button class="btn-outline" onclick="closeModal()">Hủy</button>
            <button class="btn-red" onclick="document.getElementById('userForm').requestSubmit()"><i class="fas fa-save"></i> Tạo</button>
        </div>
    `);
}

function showEditUser(id) {
    const u = allUsers.find(x => x.id === id);
    if (!u) return;
    showModal(`
        <div class="modal-header-x">
            <h3><i class="fas fa-edit"></i> Sửa người dùng #${u.id}</h3>
            <button class="modal-close-x" onclick="closeModal()">✕</button>
        </div>
        <div class="modal-body-x">
            <form id="userForm" onsubmit="return submitUser(event, ${u.id})">
                <div class="form-grid">
                    <div>
                        <label class="form-label">Tài khoản</label>
                        <input class="form-control" name="username" value="${u.username || ''}" readonly style="background:#f5f5f5"/>
                    </div>
                    <div>
                        <label class="form-label">Mật khẩu mới (để trống nếu không đổi)</label>
                        <input class="form-control" name="password" type="password" minlength="6" placeholder="Để trống nếu không đổi"/>
                    </div>
                    <div class="full">
                        <label class="form-label">Họ và tên</label>
                        <input class="form-control" name="fullName" value="${u.fullName || ''}"/>
                    </div>
                    <div>
                        <label class="form-label">Email</label>
                        <input class="form-control" name="email" type="email" value="${u.email || ''}"/>
                    </div>
                    <div>
                        <label class="form-label">Số điện thoại</label>
                        <input class="form-control" name="phone" type="tel" value="${u.phone || ''}"/>
                    </div>
                    <div>
                        <label class="form-label">Vai trò</label>
                        <select class="form-select" name="role">
                            <option value="USER" ${u.role === 'USER' ? 'selected' : ''}>USER</option>
                            <option value="ADMIN" ${u.role === 'ADMIN' ? 'selected' : ''}>ADMIN</option>
                            <option value="STAFF" ${u.role === 'STAFF' ? 'selected' : ''}>STAFF</option>
                        </select>
                    </div>
                    <div>
                        <label class="form-label">Trạng thái</label>
                        <select class="form-select" name="status">
                            <option value="1" ${u.status === '1' ? 'selected' : ''}>Hoạt động</option>
                            <option value="0" ${u.status === '0' ? 'selected' : ''}>Khóa</option>
                        </select>
                    </div>
                </div>
            </form>
        </div>
        <div class="modal-footer-x">
            <button class="btn-outline" onclick="closeModal()">Hủy</button>
            <button class="btn-red" onclick="document.getElementById('userForm').requestSubmit()"><i class="fas fa-save"></i> Lưu</button>
        </div>
    `);
}

async function submitUser(e, id) {
    e.preventDefault();
    const form = e.target;
    const data = Object.fromEntries(new FormData(form));
    if (!data.password) delete data.password;

    try {
        if (id) {
            // Update
            await http(`${API.user}/api/users/${id}`, {
                method: 'PUT',
                body: JSON.stringify(data)
            });
            showToast('Cập nhật thành công!', 'success');
        } else {
            // Create
            await http(`${API.user}/api/users/register`, {
                method: 'POST',
                body: JSON.stringify(data)
            });
            showToast('Tạo người dùng thành công!', 'success');
        }
        closeModal();
        loadUsers();
    } catch (err) {
        showToast('Lỗi: ' + err.message, 'error');
    }
    return false;
}

async function deleteUser(id, username) {
    if (!confirm(`Xóa người dùng "${username}"?\nThao tác này không thể hoàn tác.`)) return;
    try {
        await http(`${API.user}/api/users/${id}`, { method: 'DELETE' });
        showToast('Đã xóa người dùng', 'success');
        loadUsers();
    } catch (err) {
        showToast('Lỗi: ' + err.message, 'error');
    }
}

document.addEventListener('DOMContentLoaded', () => {
    if (!initAdminLayout('user')) return;
    loadUsers();
});
</script>
</body>
</html>
