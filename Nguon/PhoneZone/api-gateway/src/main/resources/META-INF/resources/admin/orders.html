<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1"/>
    <title>Đơn hàng – PhoneZone Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
</head>
<body>
<nav class="sidebar" id="sidebar"></nav>
<main class="main">
    <div class="page-header">
        <h1><i class="fas fa-shopping-bag"></i> Quản lý đơn hàng</h1>
        <button class="btn-outline" onclick="loadOrders()"><i class="fas fa-sync"></i> Refresh</button>
    </div>

    <!-- Stats nhanh -->
    <div class="row-g grid-stats" style="margin-bottom:20px">
        <div class="stat-card" style="cursor:pointer" onclick="filterByStatus('')">
            <div class="stat-icon" style="color:#1a1a2e"><i class="fas fa-list"></i></div>
            <div class="stat-num" id="cntTotal">-</div>
            <div class="stat-lbl">Tất cả</div>
        </div>
        <div class="stat-card" style="cursor:pointer" onclick="filterByStatus('PENDING')">
            <div class="stat-icon" style="color:#f39c12"><i class="fas fa-clock"></i></div>
            <div class="stat-num" id="cntPending">-</div>
            <div class="stat-lbl">Chờ xác nhận</div>
        </div>
        <div class="stat-card" style="cursor:pointer" onclick="filterByStatus('SHIPPING')">
            <div class="stat-icon" style="color:#3498db"><i class="fas fa-truck"></i></div>
            <div class="stat-num" id="cntShipping">-</div>
            <div class="stat-lbl">Đang giao</div>
        </div>
        <div class="stat-card" style="cursor:pointer" onclick="filterByStatus('DELIVERED')">
            <div class="stat-icon" style="color:#27ae60"><i class="fas fa-check-circle"></i></div>
            <div class="stat-num" id="cntDelivered">-</div>
            <div class="stat-lbl">Đã giao</div>
        </div>
    </div>

    <div class="card-box">
        <div style="display:flex;gap:10px;margin-bottom:16px;align-items:center;flex-wrap:wrap">
            <div style="position:relative;flex:1;min-width:200px;max-width:300px">
                <input type="text" id="searchInput" class="form-control" placeholder="Tìm theo mã đơn, khách hàng..." style="padding-left:36px" oninput="renderOrders()"/>
                <i class="fas fa-search" style="position:absolute;left:12px;top:50%;transform:translateY(-50%);color:#aaa"></i>
            </div>
            <select id="filterStatus" class="form-select" style="width:auto" onchange="renderOrders()">
                <option value="">Tất cả trạng thái</option>
                <option value="PENDING">Chờ xác nhận</option>
                <option value="CONFIRMED">Đã xác nhận</option>
                <option value="PACKING">Đang đóng gói</option>
                <option value="READY_TO_SHIP">Sẵn sàng giao</option>
                <option value="SHIPPING">Đang giao</option>
                <option value="OUT_FOR_DELIVERY">Shipper đang giao</option>
                <option value="DELIVERED">Đã giao</option>
                <option value="CANCELLED">Đã hủy</option>
            </select>
            <select id="filterPayment" class="form-select" style="width:auto" onchange="renderOrders()">
                <option value="">Tất cả phương thức</option>
                <option value="COD">COD (Tiền mặt)</option>
                <option value="MOMO">MoMo</option>
                <option value="VNPAY">VNPay</option>
                <option value="ZALOPAY">ZaloPay</option>
            </select>
            <div style="margin-left:auto;color:#888;font-size:13px">
                Hiển thị: <b id="orderCount">0</b> đơn
            </div>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Mã</th>
                    <th>Khách hàng</th>
                    <th>Tổng tiền</th>
                    <th>Phương thức</th>
                    <th>Trạng thái</th>
                    <th>Ngày đặt</th>
                    <th style="text-align:right">Thao tác</th>
                </tr>
            </thead>
            <tbody id="orderTable">
                <tr><td colspan="7" class="loading">Đang tải...</td></tr>
            </tbody>
        </table>
    </div>
</main>

<script src="../js/api.js"></script>
<script src="admin-shared.js"></script>
<script>
let allOrders = [];

function esc(s) { const d = document.createElement('div'); d.textContent = s ?? ''; return d.innerHTML; }

async function loadOrders() {
    try {
        allOrders = await http(`${API.order}/api/orders`);
        // Sort by date desc
        allOrders.sort((a, b) => new Date(b.date || 0) - new Date(a.date || 0));
        updateStats();
        renderOrders();
    } catch (err) {
        document.getElementById('orderTable').innerHTML =
            `<tr><td colspan="7" class="empty-state"><i class="fas fa-exclamation-circle"></i><br>Lỗi: ${err.message}</td></tr>`;
    }
}

function updateStats() {
    document.getElementById('cntTotal').textContent = allOrders.length;
    document.getElementById('cntPending').textContent = allOrders.filter(o => o.status === 'PENDING').length;
    document.getElementById('cntShipping').textContent = allOrders.filter(o => o.status === 'SHIPPING').length;
    document.getElementById('cntDelivered').textContent = allOrders.filter(o => o.status === 'DELIVERED').length;
}

function filterByStatus(status) {
    document.getElementById('filterStatus').value = status;
    renderOrders();
}

function renderOrders() {
    const kw = document.getElementById('searchInput').value.toLowerCase().trim();
    const status = document.getElementById('filterStatus').value;
    const payment = document.getElementById('filterPayment').value;

    let list = allOrders.slice();
    if (kw) {
        list = list.filter(o =>
            String(o.id).includes(kw) ||
            formatOrderCode(o).toLowerCase().includes(kw) ||
            (o.userName || '').toLowerCase().includes(kw)
        );
    }
    if (status) list = list.filter(o => o.status === status);
    if (payment) list = list.filter(o => (o.paymentMethod || 'COD') === payment);

    document.getElementById('orderCount').textContent = list.length;

    const tbody = document.getElementById('orderTable');
    if (list.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" class="empty-state"><i class="fas fa-inbox"></i><br>Không có đơn hàng</td></tr>';
        return;
    }

    tbody.innerHTML = list.map(o => `
        <tr>
            <td><b>${formatOrderCode(o)}</b></td>
            <td>
                <div style="font-weight:600">${esc(o.userName || 'User #' + o.userId)}</div>
                <div style="font-size:11px;color:#888">${(o.items||[]).reduce((s,i)=>s+(i.quantity||0),0)} sản phẩm</div>
            </td>
            <td class="price">${formatPrice(o.total)}</td>
            <td>
                ${(o.paymentMethod || 'COD') === 'MOMO' ?
                    '<span class="badge badge-disc"><i class="fas fa-qrcode"></i> MoMo</span>' :
                  (o.paymentMethod || 'COD') === 'VNPAY' ?
                    '<span class="badge badge-disc"><i class="fas fa-building-columns"></i> VNPay</span>' :
                  (o.paymentMethod || 'COD') === 'ZALOPAY' ?
                    '<span class="badge badge-disc" style="background:#e6f7ff;color:#0068ff"><i class="fas fa-qrcode"></i> ZaloPay</span>' :
                    '<span class="badge badge-stock"><i class="fas fa-money-bill"></i> COD</span>'}
            </td>
            <td><span class="badge-status badge-${o.status}">${o.status}</span></td>
            <td style="font-size:11px;color:#888">${o.date ? new Date(o.date).toLocaleString('vi-VN') : '-'}</td>
            <td style="text-align:right;white-space:nowrap">
                <button class="btn-info" onclick="viewOrder(${o.id})" title="Xem"><i class="fas fa-eye"></i></button>
                <button class="btn-warn" onclick="showUpdateStatus(${o.id}, '${o.status}')" title="Đổi trạng thái"><i class="fas fa-edit"></i></button>
            </td>
        </tr>
    `).join('');
}

function viewOrder(id) {
    const o = allOrders.find(x => x.id === id);
    if (!o) return;
    const subtotal = (o.items || []).reduce((s, it) => s + (it.total || 0), 0);

    showModal(`
        <div class="modal-header-x">
            <h3><i class="fas fa-receipt"></i> Chi tiết đơn hàng ${formatOrderCode(o)}</h3>
            <button class="modal-close-x" onclick="closeModal()">✕</button>
        </div>
        <div class="modal-body-x">
            <!-- Status banner -->
            <div style="background:linear-gradient(135deg,#fafafa,#f0f0f0);padding:14px;border-radius:8px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center">
                <div>
                    <div style="font-size:11px;color:#888;margin-bottom:4px">TRẠNG THÁI</div>
                    <span class="badge-status badge-${o.status}" style="font-size:13px;padding:5px 14px">${o.status}</span>
                </div>
                <div style="text-align:right">
                    <div style="font-size:11px;color:#888;margin-bottom:4px">TỔNG TIỀN</div>
                    <div class="price" style="font-size:20px;font-weight:800">${formatPrice(o.total)}</div>
                </div>
            </div>

            <!-- Info -->
            <table style="width:100%;font-size:13px;margin-bottom:14px">
                <tr><td style="padding:6px 0;color:#888;width:40%">Khách hàng:</td><td style="font-weight:600">${esc(o.userName || 'User #' + o.userId)}</td></tr>
                <tr><td style="padding:6px 0;color:#888">User ID:</td><td>#${o.userId}</td></tr>
                <tr><td style="padding:6px 0;color:#888">Ngày đặt:</td><td>${o.date ? new Date(o.date).toLocaleString('vi-VN') : '-'}</td></tr>
                <tr><td style="padding:6px 0;color:#888">Địa chỉ:</td><td>${o.deliveryAddress || '-'}</td></tr>
                <tr><td style="padding:6px 0;color:#888">Phương thức:</td><td>${(o.paymentMethod || 'COD') === 'MOMO' ? '💳 Chuyển khoản MoMo' : (o.paymentMethod || 'COD') === 'VNPAY' ? '🏦 Thanh toán VNPay' : (o.paymentMethod || 'COD') === 'ZALOPAY' ? '🔵 Thanh toán ZaloPay' : '💵 Tiền mặt (COD)'}</td></tr>
            </table>

            <!-- Items -->
            <div style="font-size:11px;color:#888;text-transform:uppercase;letter-spacing:.5px;font-weight:700;margin-bottom:8px">SẢN PHẨM</div>
            <div style="background:#fafafa;border-radius:8px;padding:12px">
                ${(o.items || []).map(it => `
                    <div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed #ddd;font-size:13px">
                        <div>
                            <div style="font-weight:600">${esc(it.productName)}</div>
                            <div style="font-size:11px;color:#888">${formatPrice(it.price)} × ${it.quantity}</div>
                        </div>
                        <div class="price">${formatPrice(it.total)}</div>
                    </div>
                `).join('')}
                <div style="display:flex;justify-content:space-between;padding-top:10px;font-weight:800;color:#d70018">
                    <span>Tổng:</span>
                    <span>${formatPrice(o.total)}</span>
                </div>
            </div>
        </div>
        <div class="modal-footer-x">
            <button class="btn-outline" onclick="closeModal()">Đóng</button>
        </div>
    `);
}

function showUpdateStatus(id, currentStatus) {
    const flow = {
        PENDING:          ['CONFIRMED', 'CANCELLED'],
        CONFIRMED:        ['PACKING', 'CANCELLED'],
        PACKING:          ['READY_TO_SHIP', 'CANCELLED'],
        READY_TO_SHIP:    ['SHIPPING', 'CANCELLED'],
        SHIPPING:         ['OUT_FOR_DELIVERY', 'CANCELLED'],
        OUT_FOR_DELIVERY: ['DELIVERED', 'CANCELLED'],
        DELIVERED:        [],
        CANCELLED:        []
    };
    const nextStates = flow[currentStatus] || [];

    showModal(`
        <div class="modal-header-x">
            <h3><i class="fas fa-edit"></i> Cập nhật trạng thái đơn ${formatOrderCode({id})}</h3>
            <button class="modal-close-x" onclick="closeModal()">✕</button>
        </div>
        <div class="modal-body-x">
            <p style="margin-bottom:14px">Trạng thái hiện tại: <span class="badge-status badge-${currentStatus}">${currentStatus}</span></p>
            ${nextStates.length === 0 ? `
                <div style="background:#fafafa;padding:14px;border-radius:8px;text-align:center;color:#888;font-size:13px">
                    Đơn hàng này đã ở trạng thái cuối, không thể đổi.
                </div>
            ` : `
                <p style="font-size:13px;font-weight:600;margin-bottom:10px">Chọn trạng thái mới:</p>
                <div style="display:flex;flex-direction:column;gap:8px">
                    ${nextStates.map(s => `
                        <button class="btn-outline" style="justify-content:flex-start;text-align:left" onclick="updateStatus(${id}, '${s}')">
                            <span class="badge-status badge-${s}" style="margin-right:8px">${s}</span>
                            ${s === 'CONFIRMED' ? 'Xác nhận đơn hàng (đã tiếp nhận)' : ''}
                            ${s === 'SHIPPING' ? 'Bắt đầu giao hàng' : ''}
                            ${s === 'DELIVERED' ? 'Đã giao thành công' : ''}
                            ${s === 'CANCELLED' ? 'Hủy đơn hàng' : ''}
                        </button>
                    `).join('')}
                </div>
            `}
        </div>
        <div class="modal-footer-x">
            <button class="btn-outline" onclick="closeModal()">Đóng</button>
        </div>
    `);
}

async function updateStatus(id, status) {
    if (!confirm(`Đổi trạng thái đơn ${formatOrderCode({id})} thành ${status}?`)) return;
    try {
        await http(`${API.order}/api/orders/${id}/status?status=${status}`, { method: 'PATCH' });
        showToast(`Đã đổi trạng thái sang ${status}`, 'success');
        closeModal();
        loadOrders();
    } catch (err) {
        showToast('Lỗi: ' + err.message, 'error');
    }
}

document.addEventListener('DOMContentLoaded', () => {
    if (!initAdminLayout('order')) return;
    loadOrders();
});
</script>
</body>
</html>
