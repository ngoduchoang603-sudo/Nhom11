<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Trợ lý AI | PhoneZone</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f1f5f9;color:#1e293b}.top{height:64px;background:#d70018;color:#fff;display:flex;align-items:center;padding:0 max(20px,calc((100% - 980px)/2));gap:14px}.top a{color:#fff;text-decoration:none;font-size:20px}.page{max-width:760px;margin:28px auto;padding:0 16px}.chat{height:min(70vh,620px);min-height:420px;background:#fff;border-radius:16px;box-shadow:0 8px 28px #0002;display:flex;flex-direction:column;overflow:hidden}.head{padding:18px 20px;background:linear-gradient(135deg,#6d28d9,#2563eb);color:#fff}.head h1{font-size:18px;margin:0 0 5px}.head p{margin:0;font-size:13px;opacity:.9}.messages{padding:18px;overflow-y:auto;flex:1;display:flex;gap:10px;flex-direction:column;background:#f8fafc}.message{max-width:92%;padding:12px 14px;border-radius:12px;line-height:1.55;font-size:14px;white-space:normal}.bot{align-self:flex-start;background:#fff;box-shadow:0 1px 3px #0002}.user{align-self:flex-end;background:#d70018;color:#fff}.agent-table{width:100%;border-collapse:separate;border-spacing:0;margin:10px 0;font-size:12px;overflow:hidden;border:1px solid #e4e8f0;border-radius:8px}.agent-table th{background:#eef2ff;color:#3730a3;font-weight:700}.agent-table th,.agent-table td{padding:7px;border-bottom:1px solid #edf0f4;text-align:left;vertical-align:top}.agent-table tr:last-child td{border-bottom:0}.agent-table-wrap{overflow:auto;max-width:100%}.product-cards{display:grid;gap:8px;margin-top:10px}.product-card{border:1px solid #e4e8f0;border-radius:10px;padding:10px;background:linear-gradient(110deg,#fff,#f8faff)}.product-card b{display:block;color:#1e293b}.product-card .price{color:#d70018;font-weight:800;margin-top:3px}.product-card .meta{font-size:12px;color:#64748b;margin-top:2px}.fit{display:inline-block;font-size:11px;background:#e8f6ec;color:#18753a;border-radius:20px;padding:2px 7px;margin-top:6px;font-weight:700}.tool-trace{align-self:flex-start;max-width:92%;font-size:11px;color:#475569;background:#eef2ff;border-radius:8px;padding:6px 9px}.action-proposal{border:1px solid #ddd6fe;background:#faf9ff;border-radius:10px;padding:12px;margin-top:9px}.action-proposal p{margin:4px 0 10px;color:#475569;font-size:13px}.action-proposal button{border:0;border-radius:7px;padding:8px 11px;background:#5b21b6;color:#fff;font-weight:bold;cursor:pointer}.action-proposal button.secondary{background:#e2e8f0;color:#334155;margin-left:6px}.chat-checkout{display:grid;gap:7px;margin-top:10px}.chat-checkout input,.chat-checkout textarea,.chat-checkout select{width:100%;border:1px solid #cbd5e1;border-radius:7px;padding:8px;font:inherit;font-size:12px}.chat-checkout textarea{min-height:58px;resize:vertical}.chat-checkout .confirm-order{background:#d70018}.coupon-suggestions{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:#475569}.coupon-suggestions button{padding:5px 8px;background:#047857;color:#fff}.coupon-suggestions button:first-of-type{background:#d70018}.form{display:flex;gap:10px;border-top:1px solid #e2e8f0;padding:14px}.form input{flex:1;border:1px solid #cbd5e1;border-radius:10px;padding:12px;font-size:14px}.form button{border:0;border-radius:10px;background:#6d28d9;color:#fff;padding:0 17px;cursor:pointer}.hint{font-size:12px;color:#64748b;margin:14px 3px}
    .product-card{display:grid;grid-template-columns:64px 1fr;gap:10px}.product-card .chat-card-image{width:64px;height:64px;display:grid;place-items:center;background:#fff;border-radius:8px;color:#d70018;font-size:28px}.product-card .chat-card-image:before{content:'📱'}.product-card-actions{display:flex;gap:7px;margin-top:8px}.product-card-actions a,.product-card-actions button{font:inherit;font-size:12px;font-weight:700;border:0;border-radius:7px;padding:6px 8px;cursor:pointer;text-decoration:none}.product-card-actions a{background:#eef2ff;color:#3730a3}.product-card-actions button{background:#d70018;color:#fff}
    .clear-chat{margin-left:auto;background:#ffffff22;border:1px solid #ffffff66;color:#fff;border-radius:7px;padding:6px 9px;font-weight:700;cursor:pointer;font-size:12px}
  </style>
</head>
<body>
  <header class="top"><a href="index.html" aria-label="Về trang chủ"><i class="fa-solid fa-arrow-left"></i></a><b>PhoneZone</b></header>
  <main class="page"><section class="chat"><div class="head"><h1><i class="fa-solid fa-robot"></i> Trợ lý PhoneZone</h1><p>Tư vấn điện thoại, giá và sản phẩm</p></div><div id="messages" class="messages"><div class="message bot">Chào bạn! Bạn đang cần tư vấn điện thoại theo nhu cầu hoặc tầm giá nào?</div></div><form id="chatForm" class="form"><input id="message" maxlength="500" autocomplete="off" placeholder="Nhập câu hỏi của bạn..." autofocus><button aria-label="Gửi" type="submit"><i class="fa-solid fa-paper-plane"></i></button></form></section><p class="hint">AI có thể trả lời sai; hãy kiểm tra lại giá và tồn kho trước khi đặt hàng.</p></main>
  <script src="js/api.js"></script>
  <script>
    const messages=document.getElementById('messages'),input=document.getElementById('message');
    const clearButton=document.createElement('button');clearButton.className='clear-chat';clearButton.type='button';clearButton.textContent='↻ Làm mới';document.querySelector('.head').appendChild(clearButton);clearButton.onclick=()=>{if(!confirm('Xóa cuộc trò chuyện hiện tại và bắt đầu lại?'))return;localStorage.removeItem('aiChatTranscript');localStorage.removeItem('aiChatSession');location.href='ai-chat.html'};
    const escapeHtml=(text)=>{const box=document.createElement('div');box.textContent=text||'';return box.innerHTML};
    const addCouponSuggestions=()=>document.querySelectorAll('.action-proposal').forEach(box=>{const couponInput=box.querySelector('.coupon'),text=box.querySelector('p')?.textContent||'';if(!couponInput||box.dataset.couponsReady)return;const codes=[...new Set([...text.matchAll(/(?:Mã giảm tốt nhất hiện tại:|;)\s*([A-Z0-9_-]+)\s*\(giảm/g)].map(match=>match[1]))];if(!codes.length)return;box.dataset.couponsReady='true';const choices=document.createElement('div');choices.className='coupon-suggestions';choices.innerHTML='<span>Mã giảm sâu:</span>'+codes.map((code,index)=>'<button type="button" title="Dùng mã '+escapeHtml(code)+'">'+(index===0?'Tốt nhất: ':'')+escapeHtml(code)+'</button>').join('');choices.querySelectorAll('button').forEach((button,index)=>button.onclick=()=>{couponInput.value=codes[index];showToast('Đã chọn mã '+codes[index]+'. Hệ thống kiểm tra lại trước khi tạo đơn.','success')});couponInput.insertAdjacentElement('afterend',choices)});
    new MutationObserver(addCouponSuggestions).observe(messages,{childList:true,subtree:true});
    const inline=(text)=>escapeHtml(text).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
    const markdown=(text)=>{const lines=String(text||'').split('\n'),out=[];for(let i=0;i<lines.length;){if(/^\|/.test(lines[i])&&i+1<lines.length&&/^\|?\s*:?-{3}/.test(lines[i+1])){const table=[];while(i<lines.length&&/^\|/.test(lines[i]))table.push(lines[i++]);const cells=row=>row.replace(/^\||\|$/g,'').split('|').map(x=>inline(x.trim()));out.push(`<div class="agent-table-wrap"><table class="agent-table"><thead><tr>${cells(table[0]).map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>${table.slice(2).map(r=>`<tr>${cells(r).map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`);continue}out.push(inline(lines[i]).replace(/^\s*[*-]\s+/, '• '));i++}return out.join('<br>')};
    const cards=(text)=>{const found=[...String(text||'').matchAll(/[-•]\s*\*\*(.+?)\*\*\s*—\s*phù hợp\s*(\d+)%?;\s*([\d.]+)\s*VNĐ;\s*còn\s*(\d+)/gi)];return found.length?`<div class="product-cards">${found.map(m=>`<div class="product-card"><div class="chat-card-image"></div><div><b>${escapeHtml(m[1])}</b><div class="price">${escapeHtml(m[3])} VNĐ</div><div class="meta">Còn ${escapeHtml(m[4])} sản phẩm</div><span class="fit">Phù hợp ${escapeHtml(m[2])}%</span><div class="product-card-actions"><a href="search.html?q=${encodeURIComponent(m[1])}">Xem sản phẩm</a></div></div></div>`).join('')}</div>`:''};
    let restoringChat=false;
    const add=(kind,text)=>{const item=document.createElement('div');item.className='message '+kind;item.innerHTML=markdown(text)+(kind==='bot'?cards(text):'');messages.appendChild(item);messages.scrollTop=messages.scrollHeight;if(!restoringChat){const history=JSON.parse(localStorage.getItem('aiChatTranscript')||'[]');history.push({kind,text});localStorage.setItem('aiChatTranscript',JSON.stringify(history.slice(-30)));}};
    const addToolTrace=(calls)=>{if(!Array.isArray(calls)||!calls.length)return;const item=document.createElement('div');item.className='tool-trace';item.textContent='Đã tra cứu: '+calls.map(call=>call.name+(call.dataSource?' · '+call.dataSource:'')).join(' | ');messages.appendChild(item);messages.scrollTop=messages.scrollHeight};
    (()=>{try{const history=JSON.parse(localStorage.getItem('aiChatTranscript')||'[]');if(history.length){restoringChat=true;messages.innerHTML='';history.forEach(item=>add(item.kind,item.text));restoringChat=false;}const params=new URLSearchParams(location.search);if(params.get('payment')==='success'){const orderId=params.get('orderId'),method=params.get('method')||'thanh toán online',amount=params.get('amount');const code=orderId?'PZ-'+String(orderId).padStart(10,'0'):'';add('bot','✅ Thanh toán '+method+' thành công'+(code?' cho đơn **'+code+'**':'')+(amount?' · '+new Intl.NumberFormat('vi-VN').format(Number(amount))+'đ':'')+'. Đơn hàng đã được xác nhận và PhoneZone sẽ sớm xử lý cho bạn.');history.replaceState({},document.title,'ai-chat.html');}}catch(_){}})();
    if(new URLSearchParams(location.search).get('payment')==='failed'){add('bot','❌ Thanh toán không thành công hoặc đã hết hạn. Đơn hàng chưa được đánh dấu đã thanh toán. Bạn có thể tạo lại giao dịch trong Đơn hàng của tôi.');history.replaceState({},document.title,'ai-chat.html');}
    const addCartProposal=(proposal)=>{const item=document.createElement('div');item.className='message bot';const buyNow=proposal.checkoutAfterAdd===true;item.innerHTML=`<b>${markdown(proposal.productName)}</b><br><button style="margin-top:9px;border:0;border-radius:7px;padding:8px 11px;background:#d70018;color:#fff;font-weight:bold;cursor:pointer">${buyNow?'Xác nhận mua ngay':'Xác nhận thêm vào giỏ'}</button>`;item.querySelector('button').onclick=async()=>{const button=item.querySelector('button');button.disabled=true;button.textContent='Đang kiểm tra tồn kho...';const ok=await addToCart(proposal.productId,proposal.quantity||1);if(ok){button.textContent=buyNow?'Đang chuẩn bị đơn...':'Đã thêm vào giỏ';if(buyNow){input.value='đặt hàng';document.getElementById('chatForm').requestSubmit();}}else{button.disabled=false;button.textContent=buyNow?'Xác nhận mua ngay':'Xác nhận thêm vào giỏ';}};messages.appendChild(item);messages.scrollTop=messages.scrollHeight};
    const addActionProposal=(proposal)=>{if(proposal.type==='CREATE_ORDER'){addCheckoutProposal(proposal);return}const item=document.createElement('div');item.className='message bot';item.innerHTML=`<div class="action-proposal"><b>${escapeHtml(proposal.title||'Xác nhận thao tác')}</b><p>${escapeHtml(proposal.message||'Bạn cần xác nhận trước khi tiếp tục.')}</p><button>Xác nhận và tiếp tục</button><button class="secondary">Không, giữ nguyên</button></div>`;const [confirm,cancel]=item.querySelectorAll('button');confirm.onclick=()=>{confirm.disabled=true;confirm.textContent='Đang mở...';location.href=proposal.targetUrl||'history.html'};cancel.onclick=()=>item.remove();messages.appendChild(item);messages.scrollTop=messages.scrollHeight};
    const addCheckoutProposal=(proposal)=>{const item=document.createElement('div');item.className='message bot';const user=Auth.user||{};item.innerHTML=`<div class="action-proposal"><b>${escapeHtml(proposal.title||'Xác nhận đặt hàng')}</b><p>${escapeHtml(proposal.message||'Kiểm tra thông tin trước khi tạo đơn.').replace(/\n/g,'<br>')}</p><div class="chat-checkout"><input class="recipient" placeholder="Họ tên người nhận" value="${escapeHtml(user.fullName||'')}"><input class="phone" placeholder="Số điện thoại người nhận" value="${escapeHtml(user.phone||'')}"><textarea class="address" placeholder="Số nhà, đường, phường/xã, quận/huyện, tỉnh/thành"></textarea><select class="payment"><option value="COD">Thanh toán khi nhận hàng (COD)</option><option value="MOMO">MoMo</option><option value="VNPAY">VNPay</option><option value="ZALOPAY">ZaloPay</option></select><input class="coupon" placeholder="Mã giảm giá (nếu có)"><button class="confirm-order">Xác nhận tạo đơn</button><button class="secondary">Không, giữ nguyên</button></div></div>`;const confirm=item.querySelector('.confirm-order'),cancel=item.querySelector('.secondary');confirm.onclick=async()=>{if(!Auth.user){showToast('Vui lòng đăng nhập để tạo đơn','warning');location.href='login.html';return}const recipient=item.querySelector('.recipient').value.trim(),phone=item.querySelector('.phone').value.trim(),address=item.querySelector('.address').value.trim(),payment=item.querySelector('.payment').value,coupon=item.querySelector('.coupon').value.trim().toUpperCase();if(!recipient||!phone||!address){showToast('Vui lòng nhập đủ họ tên, số điện thoại và địa chỉ','warning');return}confirm.disabled=true;confirm.textContent='Đang tạo đơn...';try{const delivery=recipient+' · '+phone+'\n'+address,order=await http(API.order+'/api/orders/checkout?userId='+Auth.user.id+'&address='+encodeURIComponent(delivery)+'&paymentMethod='+payment+'&coupon='+encodeURIComponent(coupon),{method:'POST'});await updateCartBadge();if(payment==='COD'){confirm.textContent='Đã tạo đơn #'+order.id;add('bot','Đơn '+formatOrderCode(order)+' đã được tạo thành công. Bạn thanh toán khi nhận hàng.')}else{const pay=await http(API.payment+'/api/payments',{method:'POST',body:JSON.stringify({orderId:order.id,userId:Auth.user.id,amount:order.total,orderInfo:'Thanh toán '+formatOrderCode(order),method:payment})});if(pay.payUrl){location.href=pay.payUrl;return}confirm.textContent='Đơn đã tạo';add('bot','Đơn '+formatOrderCode(order)+' đã được tạo. Mở Giỏ hàng để hoàn tất thanh toán '+payment+'.')} }catch(error){confirm.disabled=false;confirm.textContent='Xác nhận tạo đơn';showToast('Không thể tạo đơn: '+error.message,'error')}};cancel.onclick=()=>item.remove();messages.appendChild(item);messages.scrollTop=messages.scrollHeight};
    document.getElementById('chatForm').addEventListener('submit',async event=>{event.preventDefault();const message=input.value.trim();if(!message)return;input.value='';add('user',message);try{const sessionId=localStorage.getItem('aiChatSession')||crypto.randomUUID();localStorage.setItem('aiChatSession',sessionId);const headers={'Content-Type':'application/json'};if(Auth.token)headers.Authorization=`Bearer ${Auth.token}`;const response=await fetch(API.ai+'/chat',{method:'POST',headers,body:JSON.stringify({sessionId,message})});if(!response.ok)throw new Error('AI unavailable');const data=await response.json();add('bot',data.answer||'Tôi chưa có câu trả lời phù hợp.');addToolTrace(data.toolCalls);if(data.proposedCart)addCartProposal(data.proposedCart);if(data.proposedAction)addActionProposal(data.proposedAction);}catch(error){add('bot','Trợ lý đang bận. Bạn hãy thử lại sau ít phút.')}});
  </script>
</body>
</html>
