<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tài khoản của tôi – PhoneZone</title><link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"><link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet"></head><body><header id="header"></header><main class="account-page"><div class="breadcrumb-x"><a href="index.html">Trang chủ</a><i class="fas fa-chevron-right"></i><span>Tài khoản của tôi</span></div><h1>Tài khoản của tôi</h1><p class="intro">Quản lý thông tin liên hệ và địa chỉ giao hàng của bạn.</p><div class="account-grid"><section class="panel"><h2><i class="fas fa-user-circle"></i> Thông tin cá nhân</h2><div class="field"><label>Tài khoản</label><input id="username" disabled></div><div class="field"><label>Họ và tên</label><input id="fullName" placeholder="Nhập họ tên"></div><div class="field"><label>Email</label><input id="email" type="email" placeholder="email@example.com"></div><div class="field"><label>Số điện thoại</label><input id="phone" placeholder="Ví dụ: 0912345678"></div><button class="save" onclick="saveProfile()"><i class="fas fa-check"></i> Lưu thông tin</button></section><section class="panel"><div class="heading"><h2><i class="fas fa-map-marker-alt"></i> Sổ địa chỉ</h2><button class="outline" onclick="openForm()"><i class="fas fa-plus"></i> Thêm địa chỉ</button></div><div id="addresses" class="addresses"><p class="muted">Đang tải địa chỉ...</p></div></section></div></main><div id="addressDialog" class="backdrop"><div class="dialog"><div class="dialog-head"><b id="formTitle">Thêm địa chỉ</b><button onclick="closeForm()">×</button></div><div class="dialog-body"><input type="hidden" id="addressId"><div class="field"><label>Nhãn địa chỉ</label><input id="addressLabel" placeholder="Nhà riêng, công ty..."></div><div class="field"><label>Người nhận</label><input id="recipientName" placeholder="Họ và tên người nhận"></div><div class="field"><label>Số điện thoại</label><input id="recipientPhone" placeholder="Số điện thoại nhận hàng"></div><div class="field"><label>Địa chỉ chi tiết</label><textarea id="addressText" placeholder="Số nhà, đường, phường/xã, quận/huyện, tỉnh/thành"></textarea></div><label class="check"><input id="defaultAddress" type="checkbox"> Đặt làm địa chỉ mặc định</label></div><div class="dialog-foot"><button class="outline" onclick="closeForm()">Hủy</button><button class="save" onclick="saveAddress()">Lưu địa chỉ</button></div></div></div><script src="js/api.js"></script><script>let list=[];function e(v){const d=document.createElement('div');d.textContent=v||'';return d.innerHTML}async function load(){if(!Auth.requireLogin())return;header.innerHTML=renderHeader();updateHeaderUserArea();updateCartBadge();const u=await http(`${API.user}/api/users/${Auth.user.id}`);username.value=u.username||'';fullName.value=u.fullName||'';email.value=u.email||'';phone.value=u.phone||'';list=await http(`${API.user}/api/users/${Auth.user.id}/addresses`);addresses.innerHTML=list.length?list.map(a=>`<div class="address-card"><div><b>${e(a.label||'Địa chỉ giao hàng')} ${a.defaultAddress?'<span class="default">Mặc định</span>':''}</b><p><strong>${e(a.recipientName)}</strong> · ${e(a.phone)}<br>${e(a.address)}</p></div><div class="address-actions"><button onclick="edit(${a.id})"><i class="fas fa-pen"></i></button>${a.defaultAddress?'':`<button onclick="setDefault(${a.id})" title="Đặt mặc định"><i class="fas fa-star"></i></button>`}<button class="danger" onclick="removeAddress(${a.id})"><i class="fas fa-trash"></i></button></div></div>`).join(''):'<p class="muted">Chưa có địa chỉ. Hãy thêm một địa chỉ để chọn nhanh khi thanh toán.</p>'}async function saveProfile(){try{const data={fullName:fullName.value.trim(),email:email.value.trim(),phone:phone.value.trim()};const u=await http(`${API.user}/api/users/${Auth.user.id}`,{method:'PUT',body:JSON.stringify(data)});Auth.save(Auth.token,{...Auth.user,...u,id:Auth.user.id});showToast('Đã lưu thông tin cá nhân','success')}catch(x){showToast('Không thể lưu: '+x.message,'error')}}function openForm(a){addressDialog.classList.add('show');addressId.value=a?.id||'';formTitle.textContent=a?'Sửa địa chỉ':'Thêm địa chỉ';addressLabel.value=a?.label||'';recipientName.value=a?.recipientName||fullName.value||'';recipientPhone.value=a?.phone||phone.value||'';addressText.value=a?.address||'';defaultAddress.checked=a?.defaultAddress||list.length===0}function closeForm(){addressDialog.classList.remove('show')}function edit(id){openForm(list.find(a=>a.id===id))}async function saveAddress(){const body={label:addressLabel.value.trim(),recipientName:recipientName.value.trim(),phone:recipientPhone.value.trim(),address:addressText.value.trim(),defaultAddress:defaultAddress.checked};try{const id=addressId.value;await http(`${API.user}/api/users/${Auth.user.id}/addresses${id?'/'+id:''}`,{method:id?'PUT':'POST',body:JSON.stringify(body)});closeForm();await load();showToast('Đã lưu địa chỉ','success')}catch(x){showToast('Không thể lưu địa chỉ: '+x.message,'error')}}async function setDefault(id){await http(`${API.user}/api/users/${Auth.user.id}/addresses/${id}/default`,{method:'PATCH'});await load()}async function removeAddress(id){if(!confirm('Xóa địa chỉ này?'))return;await http(`${API.user}/api/users/${Auth.user.id}/addresses/${id}`,{method:'DELETE'});await load()}document.addEventListener('DOMContentLoaded',load)</script><style>*{box-sizing:border-box}body{font-family:'Be Vietnam Pro',sans-serif;background:#f5f5f5;color:#333;margin:0;min-height:100vh}.top-bar{background:#d70018;color:#fff;font-size:12px;padding:6px 0;overflow:hidden}.top-bar-inner{display:flex;gap:32px;animation:marquee 28s linear infinite;white-space:nowrap}.top-bar-inner span{display:flex;align-items:center;gap:5px}@keyframes marquee{to{transform:translateX(-50%)}}.main-header{background:#fff;box-shadow:0 2px 8px #00000014;position:sticky;top:0;z-index:1000;padding:12px 0}.logo-text{font-size:28px;font-weight:800;color:#d70018;letter-spacing:-1px;line-height:1}.logo-text span{color:#1a1a2e}.logo-sub{font-size:10px;color:#888;letter-spacing:2px}.search-bar{flex:1;max-width:480px;position:relative}.search-bar input{width:100%;border:2px solid #d70018;border-radius:24px;padding:9px 50px 9px 18px;font:14px 'Be Vietnam Pro';outline:0}.search-bar button{position:absolute;right:0;top:0;height:100%;padding:0 18px;background:#d70018;border:0;border-radius:0 24px 24px 0;color:#fff}.cart-btn{position:relative;background:transparent;border:2px solid #d70018;border-radius:8px;padding:7px 14px;color:#d70018;font-size:13px;font-weight:600;text-decoration:none;display:inline-flex;align-items:center;gap:6px}.cart-count{position:absolute;top:-8px;right:-8px;background:#d70018;color:#fff;border-radius:50%;width:18px;height:18px;font-size:10px;display:flex;align-items:center;justify-content:center;font-weight:700}.account-page{max-width:1120px;margin:0 auto;padding:30px 18px 70px}.breadcrumb-x{font-size:12px;margin:0 0 14px;color:#888}.breadcrumb-x a{color:#d70018;text-decoration:none}.breadcrumb-x i{font-size:9px;margin:0 7px}.account-page h1{font-size:27px;color:#1a1a2e;margin:0}.intro{font-size:13px;color:#777;margin:7px 0 20px}.account-grid{display:grid;grid-template-columns:370px 1fr;gap:20px}.panel{background:#fff;border-radius:12px;padding:22px;box-shadow:0 2px 11px #10182812;border:1px solid #eee}.panel h2{font-size:17px;margin:0 0 19px;color:#1a1a2e}.panel h2 i{color:#d70018;margin-right:5px}.heading{display:flex;justify-content:space-between;align-items:center}.field{margin-bottom:13px}.field label{font-size:12px;font-weight:700;display:block;margin-bottom:6px;color:#555}.field input,.field textarea{width:100%;border:1.5px solid #e1e4e8;border-radius:8px;padding:10px 12px;font:13px 'Be Vietnam Pro';outline:0}.field input:focus,.field textarea:focus{border-color:#d70018}.field input:disabled{background:#f7f7f7;color:#777}.field textarea{height:90px;resize:vertical}.save,.outline{border-radius:8px;padding:10px 14px;font:700 13px 'Be Vietnam Pro';cursor:pointer}.save{border:1px solid #d70018;background:#d70018;color:#fff}.outline{border:1px solid #ddd;background:#fff;color:#333}.addresses{display:grid;gap:10px}.address-card{border:1px solid #e7e7eb;border-radius:10px;padding:14px;display:flex;justify-content:space-between;gap:10px}.address-card p{font-size:13px;line-height:1.55;margin:7px 0 0;color:#555}.default{font-size:10px;color:#17803d;background:#e5f7eb;padding:3px 6px;border-radius:10px;margin-left:5px}.address-actions{display:flex;gap:5px;align-items:flex-start}.address-actions button{border:0;background:#f3f6fa;color:#286bb4;border-radius:6px;padding:7px;cursor:pointer}.address-actions .danger{color:#d70018}.muted{color:#888;font-size:13px}.backdrop{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:15px;z-index:500}.backdrop.show{display:flex}.dialog{width:min(500px,100%);background:#fff;border-radius:14px;overflow:hidden}.dialog-head{padding:15px 18px;background:#1a1a2e;color:#fff;display:flex;justify-content:space-between}.dialog-head button{color:#fff;border:0;background:transparent;font-size:22px}.dialog-body{padding:18px}.dialog-foot{padding:13px 18px;border-top:1px solid #eee;display:flex;justify-content:flex-end;gap:8px}.check{font-size:13px}@media(max-width:750px){.account-grid{grid-template-columns:1fr}.search-bar{order:3;flex-basis:100%}.account-page{padding:22px 12px}}</style></body></html>
