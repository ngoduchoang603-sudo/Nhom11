<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Đăng nhập – PhoneZone</title>
  <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Be Vietnam Pro',sans-serif;background:linear-gradient(135deg,#1a1a2e 0%,#16213e 50%,#d70018 150%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
    .card{background:#fff;border-radius:16px;padding:40px;width:100%;max-width:420px;box-shadow:0 20px 60px rgba(0,0,0,0.3);animation:fadeUp .4s ease}
    @keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
    .logo{text-align:center;margin-bottom:28px}
    .logo-text{font-size:32px;font-weight:800;color:#d70018;letter-spacing:-1px}
    .logo-text span{color:#1a1a2e}
    .logo-sub{font-size:11px;color:#999;letter-spacing:2px;text-transform:uppercase}
    .card h2{font-size:20px;font-weight:700;color:#1a1a2e;margin-bottom:24px;text-align:center}
    .form-group{margin-bottom:18px}
    .form-group label{font-size:13px;font-weight:600;color:#555;margin-bottom:6px;display:block}
    .input-wrap{position:relative}
    .input-wrap i.icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#aaa;font-size:14px}
    .input-wrap input{width:100%;border:2px solid #eee;border-radius:10px;padding:11px 44px;font-size:14px;font-family:'Be Vietnam Pro',sans-serif;transition:.2s;outline:none}
    .input-wrap input:focus{border-color:#d70018}
    .input-wrap .eye{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:#aaa;cursor:pointer;font-size:14px}
    .btn-primary{width:100%;background:#d70018;border:none;border-radius:10px;padding:13px;font-size:15px;font-weight:700;color:#fff;font-family:'Be Vietnam Pro',sans-serif;cursor:pointer;transition:.2s;margin-top:4px}
    .btn-primary:hover{background:#b5000f}
    .btn-primary:disabled{background:#aaa;cursor:not-allowed}
    .link-row{text-align:center;margin-top:18px;font-size:13px;color:#777}
    .link-row a{color:#d70018;font-weight:600;text-decoration:none}
    .link-row a:hover{text-decoration:underline}
    .back{position:fixed;top:20px;left:20px;color:#fff;text-decoration:none;font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px;opacity:.8;transition:.2s}
    .back:hover{opacity:1;color:#fff;text-decoration:none}
    .alert{border-radius:8px;font-size:13px;padding:10px 14px;margin-bottom:16px;display:none}
    .alert.show{display:block}
    .demo-hint{margin-top:12px;padding:10px;background:#fff3cd;border-radius:8px;font-size:11px;color:#856404}
  </style>
</head>
<body>
<a href="index.html" class="back"><i class="fas fa-arrow-left"></i> Trang chủ</a>
<div class="card">
  <div class="logo">
    <div class="logo-text">Phone<span>Zone</span></div>
    <div class="logo-sub">Điện thoại chính hãng</div>
  </div>
  <h2>Đăng nhập</h2>
  <div id="errorBox" class="alert alert-danger"><i class="fas fa-exclamation-circle mr-2"></i><span id="errorMsg"></span></div>
  <form onsubmit="return doLogin(event)">
    <div class="form-group">
      <label>Tài khoản</label>
      <div class="input-wrap"><i class="fas fa-user icon"></i><input type="text" id="username" placeholder="Nhập tài khoản" value="user01" required/></div>
    </div>
    <div class="form-group">
      <label>Mật khẩu</label>
      <div class="input-wrap"><i class="fas fa-lock icon"></i><input type="password" id="pw" placeholder="Nhập mật khẩu" value="123456" required/><i class="fas fa-eye eye" onclick="togglePw()"></i></div>
    </div>
    <button type="submit" class="btn-primary" id="loginBtn"><i class="fas fa-sign-in-alt mr-2"></i>Đăng nhập</button>
  </form>
  <div class="link-row">Chưa có tài khoản? <a href="register.html">Đăng ký ngay</a></div>

  <div class="demo-hint">
    💡 <b>Tài khoản test:</b><br>
    • Admin: <code>admin</code> / <code>admin123</code><br>
    • User: <code>user01</code> / <code>123456</code>
  </div>
</div>

<script src="js/api.js"></script>
<script>
function togglePw(){
    const i = document.getElementById('pw');
    const e = i.nextElementSibling;
    i.type = i.type === 'password' ? 'text' : 'password';
    e.classList.toggle('fa-eye');
    e.classList.toggle('fa-eye-slash');
}

function showError(msg) {
    const box = document.getElementById('errorBox');
    document.getElementById('errorMsg').textContent = msg;
    box.classList.add('show');
}

async function doLogin(e) {
    e.preventDefault();
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('pw').value;
    const btn = document.getElementById('loginBtn');

    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> Đang đăng nhập...';
    document.getElementById('errorBox').classList.remove('show');

    try {
        const resp = await fetch(`${API.user}/api/users/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
        });
        if (!resp.ok) {
            throw new Error(resp.status === 401 ? 'Tài khoản hoặc mật khẩu không đúng' : `Lỗi ${resp.status}`);
        }
        const data = await resp.json();

        let userId = null;
        try {
            const payload = JSON.parse(atob(data.token.split('.')[1]));
            userId = payload.userId;
        } catch (e) {}

        Auth.save(data.token, {
            id: userId || (username === 'admin' ? 1 : 2),
            username: data.username,
            role: data.role
        });
        window.location.href = 'index.html';
    } catch (err) {
        showError(err.message);
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-sign-in-alt mr-2"></i>Đăng nhập';
    }
    return false;
}
</script>
</body></html>
