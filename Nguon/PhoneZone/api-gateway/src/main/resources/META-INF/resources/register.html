<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Đăng ký – PhoneZone</title>
  <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Be Vietnam Pro',sans-serif;background:linear-gradient(135deg,#1a1a2e 0%,#16213e 50%,#d70018 150%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
    .card{background:#fff;border-radius:16px;padding:36px 40px;width:100%;max-width:520px;box-shadow:0 20px 60px rgba(0,0,0,0.3);animation:fadeUp .4s ease}
    @keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
    .logo{text-align:center;margin-bottom:24px}
    .logo-text{font-size:28px;font-weight:800;color:#d70018;letter-spacing:-1px}
    .logo-text span{color:#1a1a2e}
    .card h2{font-size:20px;font-weight:700;color:#1a1a2e;margin-bottom:20px;text-align:center}
    .form-group{margin-bottom:14px}
    .form-group label{font-size:13px;font-weight:600;color:#555;margin-bottom:5px;display:block}
    .input-wrap{position:relative}
    .input-wrap i.icon{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:#aaa;font-size:13px}
    .input-wrap input{width:100%;border:2px solid #eee;border-radius:10px;padding:10px 40px;font-size:13px;font-family:'Be Vietnam Pro',sans-serif;transition:.2s;outline:none}
    .input-wrap input:focus{border-color:#d70018}
    .input-wrap .eye{position:absolute;right:13px;top:50%;transform:translateY(-50%);color:#aaa;cursor:pointer;font-size:13px}
    .pw-strength{font-size:11px;margin-top:4px;font-weight:600}
    .pw-strength.weak{color:#e74c3c}.pw-strength.medium{color:#f39c12}.pw-strength.strong{color:#27ae60}
    .btn-primary{width:100%;background:#d70018;border:none;border-radius:10px;padding:12px;font-size:14px;font-weight:700;color:#fff;font-family:'Be Vietnam Pro',sans-serif;cursor:pointer;transition:.2s;margin-top:8px}
    .btn-primary:hover{background:#b5000f}
    .btn-primary:disabled{background:#aaa;cursor:not-allowed}
    .link-row{text-align:center;margin-top:16px;font-size:13px;color:#777}
    .link-row a{color:#d70018;font-weight:600;text-decoration:none}
    .back{position:fixed;top:20px;left:20px;color:#fff;text-decoration:none;font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px;opacity:.8}
    .back:hover{opacity:1;color:#fff;text-decoration:none}
    .alert{border-radius:8px;font-size:13px;padding:10px 14px;margin-bottom:14px;display:none}
    .alert.show{display:block}
  </style>
</head>
<body>
<a href="index.html" class="back"><i class="fas fa-arrow-left"></i> Trang chủ</a>
<div class="card">
  <div class="logo"><div class="logo-text">Phone<span>Zone</span></div></div>
  <h2>Tạo tài khoản mới</h2>
  <div id="errorBox" class="alert alert-danger"><i class="fas fa-exclamation-circle mr-1"></i><span id="errorMsg"></span></div>
  <form onsubmit="return doRegister(event)" id="regForm">
    <div class="form-group">
      <label>Họ và tên</label>
      <div class="input-wrap"><i class="fas fa-id-card icon"></i><input type="text" id="fullName" placeholder="Nhập họ và tên" required/></div>
    </div>
    <div class="form-group">
      <label>Tài khoản đăng nhập</label>
      <div class="input-wrap"><i class="fas fa-user icon"></i><input type="text" id="username" placeholder="Nhập tài khoản" minlength="3" required/></div>
    </div>
    <div class="form-group">
      <label>Email</label>
      <div class="input-wrap"><i class="fas fa-envelope icon"></i><input type="email" id="email" placeholder="Nhập email" required/></div>
    </div>
    <div class="form-group">
      <label>Số điện thoại</label>
      <div class="input-wrap"><i class="fas fa-phone icon"></i><input type="tel" id="phone" placeholder="Nhập số điện thoại"/></div>
    </div>
    <div class="form-group">
      <label>Mật khẩu</label>
      <div class="input-wrap"><i class="fas fa-lock icon"></i><input type="password" id="pw" placeholder="Nhập mật khẩu" minlength="6" required/><i class="fas fa-eye eye" onclick="togglePw('pw')"></i></div>
      <div class="pw-strength" id="pwStr"></div>
    </div>
    <div class="form-group">
      <label>Xác nhận mật khẩu</label>
      <div class="input-wrap"><i class="fas fa-lock icon"></i><input type="password" id="cpw" placeholder="Nhập lại mật khẩu" required/><i class="fas fa-eye eye" onclick="togglePw('cpw')"></i></div>
    </div>
    <button type="submit" class="btn-primary" id="regBtn"><i class="fas fa-user-plus mr-2"></i>Đăng ký</button>
  </form>
  <div class="link-row">Đã có tài khoản? <a href="login.html">Đăng nhập ngay</a></div>
</div>

<script src="js/api.js"></script>
<script>
function togglePw(id){
    const i = document.getElementById(id);
    const e = i.nextElementSibling;
    i.type = i.type === 'password' ? 'text' : 'password';
    e.classList.toggle('fa-eye');
    e.classList.toggle('fa-eye-slash');
}

document.getElementById('pw').addEventListener('input', function() {
    const v = this.value, el = document.getElementById('pwStr');
    let s = 0;
    if (v.match(/[a-z]/)) s++;
    if (v.match(/[A-Z]/)) s++;
    if (v.match(/[0-9]/)) s++;
    if (v.match(/[^a-zA-Z0-9]/)) s++;
    if (!v.length) { el.textContent = ''; el.className = 'pw-strength'; }
    else if (s < 2) { el.textContent = 'Yếu'; el.className = 'pw-strength weak'; }
    else if (s < 3) { el.textContent = 'Trung bình'; el.className = 'pw-strength medium'; }
    else { el.textContent = 'Mạnh'; el.className = 'pw-strength strong'; }
});

function showError(msg) {
    const box = document.getElementById('errorBox');
    document.getElementById('errorMsg').textContent = msg;
    box.classList.add('show');
    box.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

async function doRegister(e) {
    e.preventDefault();
    const pw = document.getElementById('pw').value;
    const cpw = document.getElementById('cpw').value;
    if (pw !== cpw) {
        showError('Mật khẩu xác nhận không khớp!');
        return false;
    }

    const data = {
        username: document.getElementById('username').value.trim(),
        password: pw,
        fullName: document.getElementById('fullName').value.trim(),
        email: document.getElementById('email').value.trim(),
        phone: document.getElementById('phone').value.trim()
    };

    const btn = document.getElementById('regBtn');
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> Đang đăng ký...';
    document.getElementById('errorBox').classList.remove('show');

    try {
        const resp = await fetch(`${API.user}/api/users/register`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });
        if (!resp.ok) {
            const txt = await resp.text();
            const normalized = (txt || '').toLowerCase();
            if (resp.status === 409 && normalized.includes('username')) throw new Error('Tài khoản này đã tồn tại. Vui lòng chọn tên khác.');
            if (resp.status === 409 && normalized.includes('email')) throw new Error('Email này đã được sử dụng. Vui lòng dùng email khác.');
            throw new Error('Không thể đăng ký lúc này. Vui lòng kiểm tra lại thông tin và thử lại.');
        }
        showToast('Đăng ký thành công! Đang chuyển sang đăng nhập...', 'success');
        setTimeout(() => window.location.href = 'login.html', 1500);
    } catch (err) {
        showError(err.message);
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-user-plus mr-2"></i>Đăng ký';
    }
    return false;
}
</script>
</body></html>
