<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mã giảm giá – PhoneZone Admin</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet"></head>
<body><nav class="sidebar" id="sidebar"></nav><main class="main"><div class="page-header"><h1><i class="fas fa-ticket"></i> Mã giảm giá</h1><button class="btn-red" onclick="toggleForm()"><i class="fas fa-plus"></i> Tạo mã giảm giá</button></div><div id="form" class="card-box" style="display:none;margin-bottom:18px"><h3 style="font-size:15px;margin-bottom:14px">Thiết lập mã giảm giá theo thời gian</h3><div class="row-g" style="grid-template-columns:repeat(3,1fr);gap:12px"><div><label class="form-label">Mã *</label><input id="code" class="form-control" placeholder="PHONEZONE10" maxlength="40" style="text-transform:uppercase"></div><div><label class="form-label">Tên chương trình</label><input id="name" class="form-control" placeholder="Giảm 10% cuối tuần"></div><div><label class="form-label">Loại giảm</label><select id="type" class="form-select"><option value="PERCENT">Phần trăm (%)</option><option value="FIXED">Số tiền (VND)</option></select></div><div><label class="form-label">Giá trị giảm *</label><input id="value" class="form-control" type="number" min="0" placeholder="10"></div><div><label class="form-label">Đơn tối thiểu</label><input id="min" class="form-control" type="number" min="0" value="0"></div><div><label class="form-label">Giới hạn lượt dùng</label><input id="limit" class="form-control" type="number" min="1" placeholder="Không giới hạn"></div><div><label class="form-label">Bắt đầu</label><input id="start" class="form-control" type="datetime-local"></div><div><label class="form-label">Kết thúc</label><input id="end" class="form-control" type="datetime-local"></div><div style="display:flex;align-items:end"><button class="btn-red" style="width:100%" onclick="save()">Lưu mã giảm giá</button></div></div></div><div class="card-box"><table><thead><tr><th>Mã</th><th>Chương trình</th><th>Giảm giá</th><th>Điều kiện / thời gian</th><th>Đã dùng</th><th>Trạng thái</th><th></th></tr></thead><tbody id="rows"><tr><td colspan="7" class="loading">Đang tải...</td></tr></tbody></table></div></main><script src="../js/api.js"></script><script src="admin-shared.js"></script><script>let coupons=[];const fmt=t=>t?new Date(t).toLocaleString('vi-VN'):'Không giới hạn';function toggleForm(){const f=document.getElementById('form');f.style.display=f.style.display==='none'?'block':'none'}async function load(){try{coupons=await http(`${API.order}/api/coupons`);document.getElementById('rows').innerHTML=coupons.length?coupons.map(c=>`<tr><td><b style="color:#d70018">${esc(c.code)}</b></td><td>${esc(c.name||'-')}</td><td>${c.type==='PERCENT'?c.value+'%':formatPrice(c.value)}</td><td><div>Đơn từ ${formatPrice(c.minOrderValue||0)}</div><div style="font-size:11px;color:#888">${fmt(c.startAt)} → ${fmt(c.endAt)}</div></td><td>${c.usedCount||0}${c.usageLimit?' / '+c.usageLimit:''}</td><td><span class="badge ${c.active?'badge-stock':'badge-disc'}">${c.active?'Đang bật':'Đã tắt'}</span></td><td><button class="btn-danger" onclick="disable(${c.id})" title="Tắt mã"><i class="fas fa-ban"></i></button></td></tr>`).join(''):'<tr><td colspan="7" class="empty-state">Chưa có mã giảm giá</td></tr>'}catch(e){showToast('Lỗi tải mã giảm giá: '+e.message,'error')}}async function save(){const code=document.getElementById('code').value.trim().toUpperCase(),value=Number(document.getElementById('value').value);if(!code||Number.isNaN(value)){showToast('Nhập mã và giá trị giảm giá','warning');return}const cv=v=>v?new Date(v).toISOString():null;try{await http(`${API.order}/api/coupons`,{method:'POST',body:JSON.stringify({code,name:document.getElementById('name').value.trim(),type:document.getElementById('type').value,value,minOrderValue:Number(document.getElementById('min').value||0),usageLimit:document.getElementById('limit').value?Number(document.getElementById('limit').value):null,startAt:cv(document.getElementById('start').value),endAt:cv(document.getElementById('end').value),active:true})});showToast('Đã tạo mã giảm giá','success');document.getElementById('form').style.display='none';load()}catch(e){showToast('Lỗi: '+e.message,'error')}}async function disable(id){if(!confirm('Tắt mã giảm giá này?'))return;try{await http(`${API.order}/api/coupons/${id}`,{method:'DELETE'});showToast('Đã tắt mã giảm giá','success');load()}catch(e){showToast('Lỗi: '+e.message,'error')}}document.addEventListener('DOMContentLoaded',()=>{if(initAdminLayout('coupon'))load()});</script></body></html>
