# =========================================================
# API GATEWAY - dinh tuyen request den cac microservice
# =========================================================
quarkus.application.name=api-gateway
quarkus.http.port=8080
# During local development always serve the newest frontend instead of a cached page.
quarkus.http.static-resources.caching-enabled=false
quarkus.http.static-resources.max-age=0s

# ---- CORS (cho frontend goi den) ----
quarkus.http.cors=true
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:8080,http://127.0.0.1:8080}
quarkus.http.cors.methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with,origin
quarkus.http.cors.access-control-allow-credentials=false

# ---- URL cua cac service downstream ----
shop.user-service.url=${USER_SERVICE_URL:http://localhost:8081}
shop.product-service.url=${PRODUCT_SERVICE_URL:http://localhost:8082}
shop.order-service.url=${ORDER_SERVICE_URL:http://localhost:8083}
shop.payment-service.url=${PAYMENT_SERVICE_URL:http://localhost:8084}
shop.ai-service.url=${AI_SERVICE_URL:http://localhost:8085}

# ---- JWT verify (dung public key chung) ----
mp.jwt.verify.issuer=https://shop.example.com
mp.jwt.verify.publickey.location=publicKey.pem

# ---- Health & OpenAPI ----
quarkus.smallrye-health.root-path=/health
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/swagger

# ---- Kubernetes ----
quarkus.kubernetes.namespace=shop
quarkus.kubernetes.replicas=2
quarkus.kubernetes.service-type=load-balancer
quarkus.container-image.group=shop
quarkus.container-image.name=api-gateway
quarkus.container-image.tag=1.0.0
