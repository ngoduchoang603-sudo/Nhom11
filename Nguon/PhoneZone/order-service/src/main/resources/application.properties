# =========================================================
# ORDER SERVICE - cau hinh PostgreSQL
# =========================================================
quarkus.application.name=order-service
shop.agent.internal.key=${AGENT_INTERNAL_KEY:local-demo-agent-key-change-me}
quarkus.http.port=8083

# CORS
quarkus.http.cors=true
quarkus.http.cors.origins=http://localhost:8080,http://127.0.0.1:8080
quarkus.http.cors.methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with,origin
quarkus.http.cors.access-control-allow-credentials=false

# ---- PostgreSQL DataSource ----
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER:shop}
quarkus.datasource.password=${DB_PASSWORD:shop}
quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:shop_order}

# Pool ket noi: tang timeout va retry de doi SQL Server san sang
quarkus.datasource.jdbc.max-size=32
quarkus.datasource.jdbc.min-size=4
quarkus.datasource.jdbc.acquisition-timeout=10S
quarkus.datasource.jdbc.initial-size=2

# ---- Hibernate ----
quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.log.sql=false

# ---- REST clients (goi sang microservice khac) ----
# Cau hinh dia chi cua product-service va user-service
# Note: dung configKey khop voi @RegisterRestClient(configKey="...")
quarkus.rest-client.product-client.url=${PRODUCT_SERVICE_URL:http://localhost:8082}
quarkus.rest-client.user-client.url=${USER_SERVICE_URL:http://localhost:8081}

# ---- Kafka: publish OrderCreated events asynchronously ----
mp.messaging.outgoing.order-events.connector=smallrye-kafka
mp.messaging.outgoing.order-events.topic=shop.order.created.v1
mp.messaging.outgoing.order-events.enabled=${ORDER_EVENTS_ENABLED:true}
mp.messaging.outgoing.order-events.value.serializer=io.quarkus.kafka.client.serialization.ObjectMapperSerializer
mp.messaging.outgoing.order-events.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# ---- JWT ----
mp.jwt.verify.issuer=https://shop.example.com
mp.jwt.verify.publickey.location=publicKey.pem

# ---- OpenAPI ----
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/swagger
mp.openapi.extensions.smallrye.info.title=Order Service API
mp.openapi.extensions.smallrye.info.version=1.0.0

# ---- Health ----
quarkus.smallrye-health.root-path=/health

# ---- Kubernetes ----
quarkus.kubernetes.namespace=shop
quarkus.kubernetes.replicas=2
quarkus.kubernetes.service-type=cluster-ip
quarkus.container-image.group=shop
quarkus.container-image.name=order-service
quarkus.container-image.tag=1.0.0
