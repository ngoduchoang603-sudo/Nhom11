# User Service - Quarkus app ket noi PostgreSQL
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: shop
  labels:
    app: user-service
spec:
  replicas: 2  # 2 instance de load-balancing va high-availability
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
      annotations:
        # Cho phep Prometheus tu dong scrape metrics
        prometheus.io/scrape: "true"
        prometheus.io/path: "/q/metrics"
        prometheus.io/port: "8081"
    spec:
      containers:
        - name: user-service
          image: shop/user-service:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
              name: http
          env:
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: shop-config
                  key: POSTGRES_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: shop-config
                  key: POSTGRES_PORT
            - name: DB_NAME
              value: "shop_user"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: db-secrets
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secrets
                  key: POSTGRES_PASSWORD
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          # Quarkus expose health endpoint o /q/health
          startupProbe:
            httpGet:
              path: /q/health/started
              port: 8081
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: shop
spec:
  type: ClusterIP  # Chi expose noi bo, gateway moi expose ra ngoai
  selector:
    app: user-service
  ports:
    - port: 8081
      targetPort: 8081
      name: http
---
# Horizontal Pod Autoscaler: tu dong scale 2-5 pod theo CPU
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: user-service-hpa
  namespace: shop
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: user-service
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
