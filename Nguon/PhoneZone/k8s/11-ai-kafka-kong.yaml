---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: postgres-ai, namespace: shop }
spec:
  serviceName: postgres-ai
  selector: { matchLabels: { app: postgres-ai } }
  template:
    metadata: { labels: { app: postgres-ai } }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports: [{ containerPort: 5432 }]
          env:
            - { name: POSTGRES_DB, value: shop_ai }
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: db-secrets, key: POSTGRES_USER } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: db-secrets, key: POSTGRES_PASSWORD } }
          volumeMounts: [{ name: data, mountPath: /var/lib/postgresql/data }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec: { accessModes: ["ReadWriteOnce"], resources: { requests: { storage: 2Gi } } }
---
apiVersion: v1
kind: Service
metadata: { name: postgres-ai, namespace: shop }
spec: { selector: { app: postgres-ai }, ports: [{ port: 5432, targetPort: 5432 }] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: kafka, namespace: shop }
spec:
  replicas: 1
  selector: { matchLabels: { app: kafka } }
  template:
    metadata: { labels: { app: kafka } }
    spec:
      containers:
        - name: kafka
          image: apache/kafka:3.9.0
          ports: [{ containerPort: 9092 }]
          env:
            - { name: KAFKA_NODE_ID, value: "1" }
            - { name: KAFKA_PROCESS_ROLES, value: "broker,controller" }
            - { name: KAFKA_LISTENERS, value: "PLAINTEXT://:9092,CONTROLLER://:9093" }
            - { name: KAFKA_ADVERTISED_LISTENERS, value: "PLAINTEXT://kafka:9092" }
            - { name: KAFKA_CONTROLLER_LISTENER_NAMES, value: "CONTROLLER" }
            - { name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT" }
            - { name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@kafka:9093" }
            - { name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1" }
---
apiVersion: v1
kind: Service
metadata: { name: kafka, namespace: shop }
spec: { selector: { app: kafka }, ports: [{ port: 9092, targetPort: 9092 }] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: ai-service, namespace: shop }
spec:
  replicas: 2
  selector: { matchLabels: { app: ai-service } }
  template:
    metadata: { labels: { app: ai-service } }
    spec:
      containers:
        - name: ai-service
          image: shop/ai-service:1.0.0
          ports: [{ containerPort: 8085 }]
          env:
            - { name: POSTGRES_HOST, value: postgres-ai }
            - { name: AGENT_SERVICE_URL, value: http://agent-service:8086 }
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: db-secrets, key: POSTGRES_USER } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: db-secrets, key: POSTGRES_PASSWORD } }
          readinessProbe: { httpGet: { path: /health/ready, port: 8085 }, initialDelaySeconds: 10 }
          livenessProbe: { httpGet: { path: /health/live, port: 8085 }, initialDelaySeconds: 20 }
---
apiVersion: v1
kind: Service
metadata: { name: ai-service, namespace: shop }
spec: { selector: { app: ai-service }, ports: [{ port: 8085, targetPort: 8085 }] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: agent-service, namespace: shop }
spec:
  replicas: 2
  selector: { matchLabels: { app: agent-service } }
  template:
    metadata: { labels: { app: agent-service } }
    spec:
      containers:
        - name: agent-service
          image: shop/agent-service:1.0.0
          ports: [{ containerPort: 8086 }]
          env:
            - { name: PRODUCT_SERVICE_URL, value: http://product-service:8082 }
          readinessProbe: { httpGet: { path: /health/ready, port: 8086 }, initialDelaySeconds: 10 }
          livenessProbe: { httpGet: { path: /health/live, port: 8086 }, initialDelaySeconds: 20 }
---
apiVersion: v1
kind: Service
metadata: { name: agent-service, namespace: shop }
spec: { selector: { app: agent-service }, ports: [{ port: 8086, targetPort: 8086 }] }
---
apiVersion: v1
kind: ConfigMap
metadata: { name: kong-config, namespace: shop }
data:
  kong.yml: |
    _format_version: "3.0"
    services:
      - name: shop-api
        url: http://api-gateway:80
        routes:
          - name: shop-api-route
            paths: ["/"]
            strip_path: false
        plugins:
          - name: rate-limiting
            config: { minute: 120, policy: local }
      - name: ai-service
        url: http://ai-service:8085
        routes:
          - name: ai-route
            paths: ["/ai"]
            strip_path: true
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: kong, namespace: shop }
spec:
  replicas: 2
  selector: { matchLabels: { app: kong } }
  template:
    metadata: { labels: { app: kong } }
    spec:
      containers:
        - name: kong
          image: kong:3.8
          ports: [{ containerPort: 8000 }]
          env:
            - { name: KONG_DATABASE, value: "off" }
            - { name: KONG_DECLARATIVE_CONFIG, value: /kong/kong.yml }
            - { name: KONG_PROXY_LISTEN, value: "0.0.0.0:8000" }
          volumeMounts: [{ name: kong-config, mountPath: /kong, readOnly: true }]
      volumes:
        - name: kong-config
          configMap: { name: kong-config }
---
apiVersion: v1
kind: Service
metadata: { name: kong, namespace: shop }
spec:
  type: LoadBalancer
  selector: { app: kong }
  ports: [{ port: 80, targetPort: 8000 }]
